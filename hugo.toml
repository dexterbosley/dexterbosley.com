baseURL = 'https://dexterbosley.com/'
publishDir = "docs"
languageCode = 'en-us'
title = 'Dexter Bosley'
theme = 'PaperMod'

[params]
    defaultTheme = "dark"
    ShowReadingTime = true
    # Update the feed to look at the new folder names
    mainSections = ["essays", "stories", "blog"]

[menu]
  [[menu.main]]
    identifier = "essays"
    name = "Essays"
    url = "/essays/"
    weight = 10

  [[menu.main]]
    identifier = "stories"
    name = "Stories"
    url = "/stories/"
    weight = 20

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 30

[[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40