baseURL = 'https://dexterbosley.com/'
publishDir = "docs"
languageCode = 'en-us'
title = 'Dexter Bosley'
theme = 'PaperMod'

[params]
    defaultTheme = "dark"
    ShowReadingTime = true
    # This controls what appears on the "All" (Home) page.
    # Currently set to show everything. Remove "blog" if you only want Essays/Stories there.
    mainSections = ["essays", "stories", "blog"]

[menu]
  [[menu.main]]
    identifier = "all"
    name = "All"
    url = "/"
    weight = 5

  [[menu.main]]
    identifier = "essays"
    name = "Essays"
    url = "/essays/"
    weight = 10

  [[menu.main]]
    identifier = "stories"
    name = "Stories"
    url = "/stories/"
    weight = 20

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 30

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40