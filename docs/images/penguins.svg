<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hyper-minimalist Picasso-esque penguin: angular geometric lines only -->
  <g fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body outline - single angular contour -->
    <polyline points="35,85 30,55 38,25 50,15 62,25 70,55 65,85"/>
    <!-- Wing line left -->
    <line x1="32" y1="45" x2="22" y2="62"/>
    <!-- Wing line right -->
    <line x1="68" y1="45" x2="78" y2="62"/>
    <!-- Eyes - two dots -->
    <circle cx="44" cy="32" r="2" fill="#000"/>
    <circle cx="56" cy="32" r="2" fill="#000"/>
    <!-- Beak - angular -->
    <polyline points="50,38 56,44 50,48"/>
  </g>
</svg>
