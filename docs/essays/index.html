<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Essays · Thinking in Public</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
 
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.6;
    background: #191c24;
    color: #d0d4dc;
    -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; height: auto; display: block; }

 
.site-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 40px;
}

.content-grid {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 48px;
}

 
.site-header {
    padding: 48px 0 32px;
}

.site-brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.site-brand img {
    width: 26px;
    height: auto;
    opacity: 0.8;
}

.site-brand-text {
    display: flex;
    flex-direction: column;
}

.site-name {
    font-size: 18px;
    font-weight: 500;
    color: #d0d4dc;
    letter-spacing: -0.01em;
}

.site-tagline {
    font-size: 12px;
    color: #5a6170;
    font-weight: 300;
}

.header-divider {
    border: none;
    border-top: 1px solid #2a2f3a;
    margin-bottom: 40px;
    position: relative;
}

.header-divider::after {
    content: '';
    position: absolute;
    top: -1px;
    left: 0;
    width: 40px;
    height: 2px;
    background: #8b9bb5;
}

 
.sidebar {
    position: sticky;
    top: 40px;
    align-self: start;
}

.sidebar-nav ul {
    list-style: none;
    padding: 0;
    margin: 0 0 28px 0;
}

.sidebar-nav li {
    margin-bottom: 10px;
}

.sidebar-nav a {
    font-size: 14px;
    font-weight: 400;
    color: #7a8394;
    transition: color 0.2s;
}

.sidebar-nav a:hover {
    color: #d0d4dc;
}

.sidebar-nav a.active {
    color: #d0d4dc;
    font-weight: 500;
}

.sidebar-popular {
    padding-top: 0;
}

.sidebar-popular h4 {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #5a6170;
    margin: 0 0 10px 0;
}

.sidebar-popular ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar-popular li {
    margin-bottom: 6px;
}

.sidebar-popular a {
    font-size: 13px;
    color: #7a8394;
    transition: color 0.2s;
}

.sidebar-popular a:hover {
    color: #d0d4dc;
}

.main-content {
    min-width: 0;
}


 
.post-entry {
    position: relative;
    margin-bottom: 28px;
    background: #21252e;
    border-radius: 6px;
    overflow: hidden;
    transition: box-shadow 0.2s;
}

.post-entry:hover {
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
}

.post-entry:last-child {
    margin-bottom: 0;
}

.entry-cover {
    overflow: hidden;
}

.entry-cover img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    transition: opacity 0.4s, transform 0.4s;
}

.post-entry:hover .entry-cover img {
    opacity: 0.88;
    transform: scale(1.02);
}

.post-entry.featured .entry-cover img {
    height: 280px;
}

.entry-credit {
    display: block;
    font-size: 11px;
    color: #484e5c;
    padding: 4px 20px 0;
}

.entry-text {
    padding: 14px 20px 18px;
}

.entry-meta {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #5a6170;
    margin-bottom: 4px;
}

.entry-title {
    font-size: 22px;
    font-weight: 500;
    color: #d0d4dc;
    line-height: 1.3;
    letter-spacing: -0.01em;
    transition: color 0.2s;
}

.post-entry:hover .entry-title {
    color: #a0aabe;
}

.post-entry.featured .entry-title {
    font-size: 24px;
}

.entry-desc {
    font-size: 15px;
    color: #7a8394;
    margin-top: 5px;
    line-height: 1.5;
}

.entry-desc em {
    font-family: 'Lora', Georgia, serif;
}

.entry-link {
    position: absolute;
    inset: 0;
    z-index: 1;
}

 
.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid #2a2f3a;
    font-size: 14px;
}

.pagination a {
    color: #7a8394;
    padding: 4px 10px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
}

.pagination a:hover {
    color: #d0d4dc;
    background: #2a2f3a;
}

.pagination-current {
    color: #d0d4dc;
    font-weight: 500;
    padding: 4px 10px;
}

 
.post-cover {
    margin: 0 0 4px;
    border-radius: 4px;
    overflow: hidden;
}

.post-cover img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
}

.post-cover-credit {
    font-size: 11px;
    color: #5a6170;
    margin: 4px 0 0;
}

.post-header {
    margin: 28px 0 40px;
    padding-bottom: 32px;
    border-bottom: 1px solid #2a2f3a;
    position: relative;
}

.post-header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 40px;
    height: 2px;
    background: #8b9bb5;
}

.post-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 12px;
    color: #5a6170;
    margin-bottom: 12px;
}

.post-meta .type-tag {
    font-weight: 500;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #7a8394;
}

.post-title {
    font-size: 38px;
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.025em;
    color: #d0d4dc;
}

.post-quote {
    font-family: 'Lora', Georgia, serif;
    font-size: 16px;
    color: #7a8394;
    margin-top: 12px;
    line-height: 1.6;
}

.post-content {
    font-family: 'Lora', Georgia, serif;
    font-size: 19px;
    line-height: 1.9;
    color: #d0d4dc;
    letter-spacing: 0.005em;
}

.post-content p {
    margin: 0 0 1.5em;
}

.post-content > p:first-of-type::first-letter {
    float: left;
    font-family: 'Inter', sans-serif;
    font-size: 3.6em;
    line-height: 0.82;
    padding-right: 12px;
    padding-top: 6px;
    font-weight: 600;
    color: #d0d4dc;
}

.post-content hr {
    border: none;
    text-align: center;
    margin: 2.8em 0;
}

.post-content hr::before {
    content: "✦  ✦  ✦";
    color: #5a6170;
    font-size: 10px;
    letter-spacing: 0.6em;
}

.post-content blockquote {
    margin: 2em 0;
    padding: 0 0 0 24px;
    border-left: 2px solid #3a4050;
    font-style: italic;
    color: #8b9bb5;
}

.post-content blockquote p { margin: 0; }

.post-content ul,
.post-content ol {
    margin: 1.5em 0;
    padding-left: 1.5em;
}

.post-content li { margin-bottom: 0.5em; }

.post-content img {
    border-radius: 4px;
    margin: 2.5em 0;
}

.post-content a {
    color: #8b9bb5;
    text-decoration: underline;
    text-decoration-color: #3a4050;
    text-underline-offset: 3px;
    transition: text-decoration-color 0.2s;
}

.post-content a:hover {
    text-decoration-color: #8b9bb5;
}

 
.story-content {
    font-size: 18px;
    line-height: 2;
}

 
.post-epigraph {
    margin-bottom: 36px;
    padding-left: 20px;
    border-left: 2px solid #2a2f3a;
}

.post-epigraph p {
    font-family: 'Lora', Georgia, serif;
    font-size: 16px;
    font-style: italic;
    color: #7a8394;
    line-height: 1.6;
}

.post-epigraph cite {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-style: normal;
    color: #5a6170;
    display: block;
    margin-top: 6px;
}

 
.post-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid #2a2f3a;
    position: relative;
}

.post-nav::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 0;
    width: 40px;
    height: 2px;
    background: #8b9bb5;
}

.back-link {
    font-size: 14px;
    color: #7a8394;
    transition: color 0.2s, letter-spacing 0.2s;
}

.back-link:hover {
    color: #d0d4dc;
    letter-spacing: 0.02em;
}

 
.share-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 0;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    color: #5a6170;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.2s;
}

.share-btn:hover { color: #d0d4dc; }
.share-btn svg { width: 14px; height: 14px; }

 
.about-banner {
    margin: 0 0 28px;
    border-radius: 4px;
    overflow: hidden;
}

.about-banner img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    object-position: center 70%;
}

.about-banner-credit {
    font-size: 11px;
    color: #5a6170;
    margin-top: 4px;
}

.about-name {
    font-size: 28px;
    font-weight: 500;
    color: #d0d4dc;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
}

.about-intro {
    font-family: 'Lora', Georgia, serif;
    font-size: 16px;
    line-height: 1.7;
    color: #7a8394;
    margin-bottom: 32px;
}

.about-details {
    margin-bottom: 32px;
}

.about-row {
    display: flex;
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.5;
}

.about-label {
    width: 100px;
    flex-shrink: 0;
    color: #5a6170;
    font-weight: 400;
}

.about-value {
    color: #d0d4dc;
}

.about-connect a {
    font-size: 14px;
    color: #8b9bb5;
    border-bottom: 1px solid #2a2f3a;
    transition: color 0.2s, border-color 0.2s;
}

.about-connect a:hover {
    color: #d0d4dc;
    border-color: #5a6170;
}

 
.mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #191c24;
    border-top: 1px solid #2a2f3a;
    padding: 12px 0;
    justify-content: space-around;
    z-index: 100;
}

.mobile-nav a {
    font-size: 12px;
    color: #5a6170;
    padding: 8px 16px;
    transition: color 0.2s;
}

.mobile-nav a.active {
    color: #d0d4dc;
    font-weight: 500;
}

 
@media (max-width: 700px) {
    .site-container {
        padding: 0 20px;
    }

    .site-header {
        padding: 28px 0 20px;
    }

    .header-divider {
        margin-bottom: 24px;
    }

    .content-grid {
        display: block;
    }

    .sidebar {
        display: none;
    }

    .mobile-nav {
        display: flex;
    }

    body {
        padding-bottom: 60px;
    }

     
    .post-entry {
        margin-bottom: 20px;
        margin-left: -20px;
        margin-right: -20px;
        border-radius: 0;
    }

    .entry-cover img {
        height: 200px;
    }

    .post-entry.featured .entry-cover img {
        height: 220px;
    }

    .entry-credit {
        padding-left: 20px;
        padding-right: 20px;
    }

    .entry-text {
        padding-left: 20px;
        padding-right: 20px;
    }

    .entry-title { font-size: 20px; }
    .post-entry.featured .entry-title { font-size: 21px; }

     
    .post-title { font-size: 26px; }

    .post-cover {
        margin-left: -20px;
        margin-right: -20px;
        border-radius: 0;
    }

    .post-cover img {
        max-height: 280px;
        border-radius: 0;
    }

    .post-content { font-size: 17px; }

     
    .about-banner {
        margin-left: -20px;
        margin-right: -20px;
        border-radius: 0;
    }

    .about-banner img {
        height: 260px;
    }
}
</style>
</head>
<body>
    <div class="site-container">
        <header class="site-header">
            <a href="/" class="site-brand">
                <img src="/images/penguin-logo.svg" alt="">
                <div class="site-brand-text">
                    <span class="site-name">Thinking in Public</span>
                    <span class="site-tagline">by Dexter Bosley</span>
                </div>
            </a>
        </header>

        <hr class="header-divider">

        <div class="content-grid">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <ul>
                        <li><a href="/">All</a></li>
                        <li><a href="/essays/">Essays</a></li>
                        <li><a href="/stories/">Stories</a></li>
                        <li><a href="/about/">About</a></li>
                    </ul>
                </nav>
                <div class="sidebar-popular">
                    <h4>Popular</h4>
                    <ul>
                        <li><a href="/stories/small-talk/">Small Talk</a></li>
                    </ul>
                </div>
            </aside>

            <main class="main-content">
                
<article class="post-entry featured">
  <div class="entry-cover">
    <img loading="lazy" src="https://www.dexterbosley.com/images/about-banner.jpg" alt="Mountain landscape">
  </div>
  <div class="entry-text">
    <div class="entry-meta">Essay · Jan 25, 2025</div>
    <h2 class="entry-title">On Agentic Software</h2>
    <p class="entry-desc"><em>"The best software is the software you never have to use."</em></p>
  </div>
  <a class="entry-link" aria-label="post link to On Agentic Software" href="https://www.dexterbosley.com/essays/on-agentic-software/"></a>
</article>
            </main>
        </div>
    </div>

    <nav class="mobile-nav">
        <a href="/">All</a>
        <a href="/essays/">Essays</a>
        <a href="/stories/">Stories</a>
        <a href="/about/">About</a>
    </nav>

    <script>
        (function() {
            var path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.sidebar-nav a, .mobile-nav a').forEach(function(link) {
                var href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });
        })();
    </script>
</body>
</html>
