<script>
document.querySelectorAll('.share-btn').forEach(btn => {
    btn.addEventListener('click', async function() {
        const data = {
            title: 'Test Work Post',
            url: window.location.href
        };
        
        if (navigator.share) {
            try {
                await navigator.share(data);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    copyToClipboard(this);
                }
            }
        } else {
            copyToClipboard(this);
        }
        
        function copyToClipboard(button) {
            navigator.clipboard.writeText(window.location.href).then(function() {
                const span = button.querySelector('span');
                span.textContent = 'Copied';
                setTimeout(() => span.textContent = 'Share', 2000);
            });
        }
    });
});

        (function() {
            const path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.sidebar-nav a, .mobile-nav a').forEach(link => {
                const href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });
        })();
    </script>
</body>
</html>
