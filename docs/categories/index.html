<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories · Thinking in Public</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
 
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.6;
    background: #f7f8fa;
    color: #1a1d23;
    -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; height: auto; display: block; }

 
.site-container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
}

 
.site-header {
    padding: 48px 0 40px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}

.site-brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.site-brand img {
    width: 26px;
    height: auto;
    opacity: 0.8;
}

.site-brand-text {
    display: flex;
    flex-direction: column;
}

.site-name {
    font-size: 18px;
    font-weight: 500;
    color: #1a1d23;
    letter-spacing: -0.01em;
}

.site-tagline {
    font-size: 12px;
    color: #9ca3af;
    font-weight: 300;
}

.site-nav {
    display: flex;
    gap: 24px;
}

.site-nav a {
    font-size: 14px;
    font-weight: 400;
    color: #6b7280;
    transition: color 0.2s;
}

.site-nav a:hover {
    color: #1a1d23;
}

.site-nav a.active {
    color: #1a1d23;
    font-weight: 500;
}

 
.popular-bar {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 36px;
    padding-bottom: 28px;
    border-bottom: 1px solid #e5e7eb;
}

.popular-bar a {
    color: #475569;
    transition: color 0.2s;
}

.popular-bar a:hover {
    color: #1a1d23;
}

 
.post-entry {
    position: relative;
    margin-bottom: 40px;
    padding-bottom: 40px;
    border-bottom: 1px solid #e5e7eb;
}

.post-entry:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

.entry-cover {
    margin-bottom: 16px;
    border-radius: 3px;
    overflow: hidden;
}

.entry-cover img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    transition: opacity 0.3s;
}

.post-entry:hover .entry-cover img {
    opacity: 0.92;
}

.post-entry.featured .entry-cover img {
    height: 300px;
}

.entry-cover-credit {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 6px;
}

.entry-title {
    font-size: 22px;
    font-weight: 500;
    color: #1a1d23;
    line-height: 1.3;
    letter-spacing: -0.01em;
    transition: color 0.2s;
}

.post-entry:hover .entry-title {
    color: #3b4252;
}

.post-entry.featured .entry-title {
    font-size: 24px;
}

.entry-description {
    font-size: 15px;
    color: #6b7280;
    margin-top: 6px;
    line-height: 1.5;
}

.entry-quote {
    margin-top: 10px;
    padding: 0;
    border: none;
}

.entry-quote p {
    font-family: 'Lora', Georgia, serif;
    font-size: 15px;
    font-style: italic;
    color: #6b7280;
    line-height: 1.5;
}

.entry-quote cite {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-style: normal;
    color: #9ca3af;
}

.entry-meta {
    font-size: 13px;
    color: #9ca3af;
    margin-top: 10px;
}

.entry-link {
    position: absolute;
    inset: 0;
    z-index: 1;
}

 
.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid #e5e7eb;
    font-size: 14px;
}

.pagination a {
    color: #6b7280;
    padding: 4px 10px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
}

.pagination a:hover {
    color: #1a1d23;
    background: #eef0f3;
}

.pagination-current {
    color: #1a1d23;
    font-weight: 500;
    padding: 4px 10px;
}

 
.post-header {
    margin-bottom: 8px;
}

.post-title {
    font-size: 34px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: #1a1d23;
}

.post-cover {
    margin: 0 0 8px;
    border-radius: 4px;
    overflow: hidden;
}

.post-cover img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
}

.post-cover-credit {
    font-size: 12px;
    color: #9ca3af;
    font-style: italic;
    margin: 8px 0 0;
}

.post-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 36px;
}

.post-meta .spacer { flex: 1; }

.post-content {
    font-family: 'Lora', Georgia, serif;
    font-size: 18px;
    line-height: 1.85;
    color: #1a1d23;
    letter-spacing: 0.005em;
}

.post-content p {
    margin: 0 0 1.6em;
}

.post-content > p:first-of-type::first-letter {
    float: left;
    font-size: 3.2em;
    line-height: 0.85;
    padding-right: 10px;
    padding-top: 4px;
    font-weight: 500;
    color: #1a1d23;
}

.post-content hr {
    border: none;
    text-align: center;
    margin: 2.5em 0;
}

.post-content hr::before {
    content: "· · ·";
    color: #d1d5db;
    font-size: 18px;
    letter-spacing: 0.5em;
}

.post-content blockquote {
    margin: 2em 0;
    padding: 0 0 0 24px;
    border-left: 2px solid #d1d5db;
    font-style: italic;
    color: #475569;
}

.post-content blockquote p { margin: 0; }

.post-content ul,
.post-content ol {
    margin: 1.5em 0;
    padding-left: 1.5em;
}

.post-content li { margin-bottom: 0.5em; }

.post-content img {
    border-radius: 3px;
    margin: 2em 0;
}

.post-content a {
    color: #475569;
    text-decoration: underline;
    text-decoration-color: #d1d5db;
    text-underline-offset: 3px;
    transition: text-decoration-color 0.2s;
}

.post-content a:hover {
    text-decoration-color: #475569;
}

 
.post-epigraph {
    margin-bottom: 32px;
    padding-left: 20px;
    border-left: 2px solid #d1d5db;
}

.post-epigraph p {
    font-family: 'Lora', Georgia, serif;
    font-size: 16px;
    font-style: italic;
    color: #6b7280;
    line-height: 1.6;
}

.post-epigraph cite {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-style: normal;
    color: #9ca3af;
    display: block;
    margin-top: 6px;
}

 
.post-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid #e5e7eb;
}

.back-link {
    font-size: 14px;
    color: #6b7280;
    transition: color 0.2s;
}

.back-link:hover { color: #1a1d23; }

 
.share-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 0;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    color: #9ca3af;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.2s;
}

.share-btn:hover { color: #1a1d23; }
.share-btn svg { width: 14px; height: 14px; }

 
.about-banner {
    margin: 0 0 32px;
    border-radius: 4px;
    overflow: hidden;
}

.about-banner img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    object-position: center 70%;
}

.about-banner-credit {
    font-size: 12px;
    color: #9ca3af;
    font-style: italic;
    margin-top: 8px;
}

.about-intro {
    font-family: 'Lora', Georgia, serif;
    font-size: 17px;
    line-height: 1.7;
    color: #1a1d23;
    margin-bottom: 36px;
}

.about-details {
    margin-bottom: 36px;
}

.about-row {
    display: flex;
    margin-bottom: 14px;
    font-size: 15px;
    line-height: 1.5;
}

.about-label {
    width: 110px;
    flex-shrink: 0;
    color: #9ca3af;
    font-weight: 400;
}

.about-value {
    color: #1a1d23;
}

.about-contact {
    font-size: 14px;
    color: #6b7280;
}

.about-contact a {
    color: #475569;
    border-bottom: 1px solid #d1d5db;
    transition: color 0.2s, border-color 0.2s;
}

.about-contact a:hover {
    color: #1a1d23;
    border-color: #9ca3af;
}

 
.mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #f7f8fa;
    border-top: 1px solid #e5e7eb;
    padding: 12px 0;
    justify-content: space-around;
    z-index: 100;
}

.mobile-nav a {
    font-size: 12px;
    color: #9ca3af;
    padding: 8px 16px;
    transition: color 0.2s;
}

.mobile-nav a.active {
    color: #1a1d23;
    font-weight: 500;
}

 
@media (max-width: 700px) {
    .site-container {
        padding: 0 20px;
    }

    .site-header {
        padding: 28px 0 24px;
        flex-direction: column;
        gap: 16px;
    }

    .site-nav {
        display: none;
    }

    .mobile-nav {
        display: flex;
    }

    body {
        padding-bottom: 60px;
    }

     
    .post-entry {
        margin-bottom: 32px;
        padding-bottom: 32px;
    }

    .entry-cover {
        margin-left: -20px;
        margin-right: -20px;
        border-radius: 0;
    }

    .entry-cover img {
        height: 200px;
        border-radius: 0;
    }

    .post-entry.featured .entry-cover img {
        height: 220px;
    }

    .entry-title { font-size: 20px; }
    .post-entry.featured .entry-title { font-size: 21px; }

     
    .post-title { font-size: 26px; }

    .post-cover {
        margin-left: -20px;
        margin-right: -20px;
        border-radius: 0;
    }

    .post-cover img {
        max-height: 280px;
        border-radius: 0;
    }

    .post-content { font-size: 17px; }

     
    .about-banner {
        margin-left: -20px;
        margin-right: -20px;
        border-radius: 0;
    }

    .about-banner img {
        height: 260px;
    }
}
</style>
</head>
<body>
    <div class="site-container">
        <header class="site-header">
            <a href="/" class="site-brand">
                <img src="/images/penguin-logo.svg" alt="">
                <div class="site-brand-text">
                    <span class="site-name">Thinking in Public</span>
                    <span class="site-tagline">by Dexter Bosley</span>
                </div>
            </a>
            <nav class="site-nav">
                <a href="/">All</a>
                <a href="/essays/">Essays</a>
                <a href="/stories/">Stories</a>
                <a href="/about/">About</a>
            </nav>
        </header>

        <main>
            
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="/">All</a>
        <a href="/essays/">Essays</a>
        <a href="/stories/">Stories</a>
        <a href="/about/">About</a>
    </nav>

    <script>
        (function() {
            var path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.site-nav a, .mobile-nav a').forEach(function(link) {
                var href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });
        })();
    </script>
</body>
</html>
