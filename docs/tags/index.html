    <script>
        (function() {
            const currentPath = window.location.pathname.replace(/\/page\/[0-9]+\/?$/, "").replace(/\/$/, "");
            document.querySelectorAll('.sidebar-menu a, .mobile-nav a').forEach(link => {
                link.classList.remove('active');
                const linkPath = link.getAttribute('href').replace(/\/$/, "");
                if ((currentPath === "" || currentPath === "/") && (linkPath === "" || linkPath === "/")) {
                    link.classList.add('active');
                } else if (linkPath !== "" && linkPath !== "/" && currentPath.startsWith(linkPath)) {
                    link.classList.add('active');
                }
            });
        })();
    </script>

    <script>
        (function() {
            const toggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            
            
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                html.dataset.theme = 'dark';
                toggle.querySelector('.sun-icon').style.display = 'none';
                toggle.querySelector('.moon-icon').style.display = 'block';
            } else {
                html.dataset.theme = 'light';
                toggle.querySelector('.sun-icon').style.display = 'block';
                toggle.querySelector('.moon-icon').style.display = 'none';
            }
            
            toggle.addEventListener('click', function() {
                if (html.dataset.theme === 'dark') {
                    html.dataset.theme = 'light';
                    localStorage.setItem('theme', 'light');
                    toggle.querySelector('.sun-icon').style.display = 'block'; toggle.querySelector('.moon-icon').style.display = 'none';
                } else {
                    html.dataset.theme = 'dark';
                    localStorage.setItem('theme', 'dark');
                    toggle.querySelector('.sun-icon').style.display = 'none'; toggle.querySelector('.moon-icon').style.display = 'block';
                }
            });
        })();
    </script>
