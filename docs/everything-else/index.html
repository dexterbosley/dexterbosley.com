<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>


    <script>
        
        document.getElementById('menu-trigger').addEventListener('click', function() {
            var navGroup = document.getElementById('nav-group');
            navGroup.classList.toggle('show');
        });

        
        (function() {
            const currentPath = window.location.pathname.replace(/\/$/, ""); 
            const links = document.querySelectorAll('.sidebar-menu a');
            links.forEach(link => {
                link.classList.remove('active'); 
                const linkHref = link.getAttribute('href');
                const linkPath = linkHref.replace(/\/$/, "");
                
                if ((currentPath === "" || currentPath === "/") && (linkPath === "" || linkPath === "/")) {
                    link.classList.add('active');
                }
                else if (linkPath !== "" && linkPath !== "/" && currentPath.startsWith(linkPath)) {
                    link.classList.add('active');
                }
            });
        })();

        
        document.addEventListener("DOMContentLoaded", function() {
            var toggle = document.getElementById("theme-toggle");
            if(toggle) toggle.remove();
            
            var toggles = document.querySelectorAll(".theme-toggle");
            toggles.forEach(t => t.remove());
        });
    </script>
