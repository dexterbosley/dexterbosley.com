    <script>
        (function() {
            
            var path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.sidebar-nav a, .mobile-nav a').forEach(function(link) {
                var href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });

            
            document.querySelectorAll('.lazy-reveal').forEach(function(img) {
                if (img.complete) { img.classList.add('loaded'); }
                else { img.addEventListener('load', function() { img.classList.add('loaded'); }); }
            });

            
            var progress = document.querySelector('.reading-progress');
            var article = document.querySelector('.post-content');
            if (progress && article) {
                window.addEventListener('scroll', function() {
                    var rect = article.getBoundingClientRect();
                    var total = article.offsetHeight - window.innerHeight;
                    var scrolled = -rect.top;
                    var pct = Math.max(0, Math.min(100, (scrolled / total) * 100));
                    progress.style.width = pct + '%';
                }, { passive: true });
            }
        })();
