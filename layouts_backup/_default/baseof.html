<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Thinking in Public</title>
    {{- partial "head.html" . -}}
    
    <script>
        document.documentElement.dataset.theme = 'dark';
        localStorage.setItem("pref-theme", "dark");
    </script>

    <style>
        /* --- 2. NUCLEAR CSS: HIDE THEME TOGGLE EVERYWHERE --- */
        #theme-toggle, .theme-toggle, button[title="(Alt + T)"] { 
            display: none !important; 
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            pointer-events: none !important;
        }

        /* --- GLOBAL VARIABLES --- */
        :root {
            --gap: 24px;
            --content-gap: 20px;
        }

        /* --- LAYOUT GRID (DESKTOP) --- */
        #Box { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        @media (min-width: 800px) {
            #Box {
                display: grid;
                grid-template-columns: 200px 1fr;
                grid-template-rows: auto 1fr;
                grid-template-areas: "banner banner" "sidebar main";
                column-gap: 40px;
            }
            .df-banner-wrapper { grid-area: banner; margin-bottom: 20px; }
            #Sidebar { 
                grid-area: sidebar; 
                text-align: right; 
                border-right: 1px solid var(--border); 
                padding-right: 20px;
                display: flex;
                flex-direction: column;
            }
            #Main { grid-area: main; }
            
            /* DESKTOP ORDERING: Nav First */
            .nav-group { order: 1; display: block !important; }
            .popular-group { order: 2; margin-top: 30px; }
            .mobile-menu-trigger { display: none !important; }
        }

        /* --- MOBILE LAYOUT --- */
        @media (max-width: 799px) {
            #Box { display: block; }
            
            #Sidebar {
                text-align: center;
                padding-bottom: 5px;
                margin-bottom: 10px;
                display: flex;
                flex-direction: column;
                border-bottom: 1px solid var(--border);
            }

            /* MOBILE ORDERING: Popular First */
            .popular-group { 
                order: 1; 
                margin-bottom: 15px; 
            }
            .nav-group { order: 2; }

            /* Hamburger Button */
            .mobile-menu-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                cursor: pointer;
                padding: 5px;
                margin-left: 10px;
                color: var(--primary);
            }

            .nav-group {
                display: none; 
                padding-bottom: 15px;
                border-bottom: 1px dashed var(--border);
                margin-top: 10px;
                margin-bottom: 15px;
            }

            .nav-group.show {
                display: block;
                animation: fadeIn 0.3s ease;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- COMPONENT STYLES --- */
        .sidebar-menu { list-style: none; padding: 0; line-height: 2.0; font-size: 18px; }
        .sidebar-menu a {
            text-decoration: none;
            color: var(--primary);
            border-bottom: none;
            display: inline-block;
        }
        .sidebar-menu a:hover { color: var(--secondary); }
        .sidebar-menu a.active {
            font-weight: bold !important;
            border-bottom: none !important;
            color: var(--primary) !important;
        }

        /* SUBSCRIBE BUTTON */
        .nav-subscribe-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 18px;
            border: 1px solid var(--primary);
            border-radius: 50px;
            text-decoration: none !important;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            text-align: center;
            color: var(--primary) !important;
            background-color: transparent;
        }
        .nav-subscribe-btn:hover {
            background-color: var(--primary);
            color: var(--theme) !important;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="" id="top">
    <div id="Box">
        <div class="df-banner-wrapper">
             <header class="header">
                <nav class="nav" style="display: flex !important; justify-content: space-between; align-items: center; width: 100%;">
                    
                    <div class="logo" style="display: flex; align-items: center; gap: 15px;">
                        <div style="display: flex; flex-direction: column; line-height: 1.2;">
                            <a href="/" accesskey="h" title="Thinking in Public" style="font-size: 24px; font-weight: bold; text-decoration: none; color: inherit;">
                                Thinking in Public
                            </a>
                            <span style="font-size: 14px; opacity: 0.8;">by Dexter Bosley</span>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center;">
                        
                        <button class="mobile-menu-trigger" id="menu-trigger" aria-label="Toggle Menu">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="3" y1="18" x2="21" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </nav>
            </header>
        </div>

        <div id="Sidebar">
            
            <div class="popular-group" style="background: var(--entry); padding: 15px; border-radius: 8px; border: 1px solid var(--border); text-align: left;">
                <h3 style="font-size: 11px; text-transform: uppercase; color: var(--secondary); margin: 0 0 10px 0; letter-spacing: 2px; font-weight: bold;">Popular</h3>
                <ul class="sidebar-menu" style="font-size: 14px; line-height: 1.4; margin: 0; padding: 0;">
                    <li style="margin-bottom: 6px;"><a href="/essays/test-essay/" style="display: block;">Test Essay</a></li>
                    <li><a href="/stories/test-story/" style="display: block;">Test Story</a></li>
                </ul>
            </div>

            <div class="nav-group" id="nav-group">
                <ul class="sidebar-menu">
                    <li><a href="/">All</a></li>
                    <li><a href="/essays/">Essays</a></li>
                    <li><a href="/stories/">Stories</a></li>
                    <li><a href="/about/">About</a></li>
                </ul>

                <div style="margin-bottom: 25px;">
                    <a href="/subscribe" class="nav-subscribe-btn">
                        Subscribe
                    </a>
                </div>
            </div>

        </div>

        <main id="Main" class="main">
            {{ block "main" . }}{{ end }}
        </main>
    </div>

    {{ partial "footer.html" . }}

    <script>
        // Hamburger Logic
        document.getElementById('menu-trigger').addEventListener('click', function() {
            var navGroup = document.getElementById('nav-group');
            navGroup.classList.toggle('show');
        });

        // Bolding Logic
        (function() {
            const currentPath = window.location.pathname.replace(/\/$/, ""); 
            const links = document.querySelectorAll('.sidebar-menu a');
            links.forEach(link => {
                link.classList.remove('active'); 
                const linkHref = link.getAttribute('href');
                const linkPath = linkHref.replace(/\/$/, "");
                
                if ((currentPath === "" || currentPath === "/") && (linkPath === "" || linkPath === "/")) {
                    link.classList.add('active');
                }
                else if (linkPath !== "" && linkPath !== "/" && currentPath.startsWith(linkPath)) {
                    link.classList.add('active');
                }
            });
        })();

        // Safety Script: Remove Theme Toggle if it exists
        document.addEventListener("DOMContentLoaded", function() {
            var toggle = document.getElementById("theme-toggle");
            if(toggle) toggle.remove();
            
            var toggles = document.querySelectorAll(".theme-toggle");
            toggles.forEach(t => t.remove());
        });
    </script>
</body>
</html>
