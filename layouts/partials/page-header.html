<header class="post-header">
    <h1 class="post-title">{{ if eq .Layout "about" }}About Dexter Bosley{{ else }}{{ .Title }}{{ end }}</h1>
    <div class="post-utility">
        {{- if not .Date.IsZero }}
        <div class="post-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "date-long.html" .Date }}</time>
        </div>
        {{- end }}
        <nav class="post-actions-compact" aria-label="Page actions">
            <a href="/">&lt; BACK</a>
            <button class="share-link" type="button" data-share-url="{{ .Permalink }}" data-share-title="{{ .Title }}">^ SHARE</button>
        </nav>
    </div>
</header>
