{{- $pages := .pages -}}
{{- $label := .label -}}
{{- $id := .id -}}
<section class="home-section" aria-labelledby="{{ $id }}">
    <h2 class="home-section-title" id="{{ $id }}">{{ $label }}</h2>
    <div class="home-rows">
        {{- range $pages }}
        {{- $deck := .Params.deck | default .Params.description -}}
        <article class="home-row">
            <h3 class="home-row-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            {{- with $deck }}
            <p class="home-row-deck">{{ . }}</p>
            {{- end }}
            <p class="home-row-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ upper (.Date.Format "Jan 2006") }}</time><span>{{ .ReadingTime }} MIN</span></p>
        </article>
        {{- end }}
    </div>
</section>
