{{- $kind := cond (eq .Section "stories") "story" "essay" }}
<article class="post-single post-template-{{ $kind }}">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        <div class="post-meta">{{ .Date.Format "02.01.2006" }}</div>
    </header>

    <div class="post-content">
        {{ .Content }}
    </div>

    <nav class="post-nav" aria-label="Post navigation">
        <a href="{{ if eq .Section "stories" }}/stories/{{ else if eq .Section "essays" }}/essays/{{ else }}/{{ end }}">Back</a>
    </nav>
</article>
