{{- $kind := cond (eq .Section "stories") "story" "essay" }}
<article class="post-single post-template-{{ $kind }}">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        <div class="post-meta">{{ .Date.Format "02.01.2006" }}</div>
    </header>

    <div class="post-content">
        {{ .Content }}
    </div>

    <nav class="post-actions" aria-label="Post actions">
        <a href="/">Back</a>
        <button class="share-link" type="button" data-share-url="{{ .Permalink }}">Share</button>
    </nav>
</article>

<script>
document.querySelectorAll('.share-link').forEach(function(button) {
    button.addEventListener('click', async function() {
        var url = button.getAttribute('data-share-url') || window.location.href;
        var original = button.textContent;

        async function copyLink() {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(url);
            } else {
                window.prompt('Copy this link:', url);
            }
        }

        try {
            if (navigator.share) {
                await navigator.share({ title: document.title, url: url });
                return;
            }
            await copyLink();
            button.textContent = 'Copied';
        } catch (error) {
            if (error && error.name === 'AbortError') return;
            window.prompt('Copy this link:', url);
        }

        window.setTimeout(function() {
            button.textContent = original;
        }, 1600);
    });
});
</script>
