    <script>
        (function() {
            var root = document.documentElement;
            var themeButtons = document.querySelectorAll("[data-theme-choice]");
            var sizeToggle = document.querySelector("[data-text-size-toggle]");
            var sizeStrip = document.querySelector("[data-text-size-strip]");
            var sizeButtons = document.querySelectorAll("[data-text-size-choice]");

            function activeTheme() {
                if (root.dataset.theme === "light" || root.dataset.theme === "dark") return root.dataset.theme;
                return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }

            function activeSize() {
                return root.dataset.size === "small" || root.dataset.size === "large" ? root.dataset.size : "standard";
            }

            function persist(key, value) {
                try {
                    window.localStorage.setItem(key, value);
                } catch (error) {}
            }

            function track(name) {
                if (!name || !window.goatcounter || typeof window.goatcounter.count !== "function") return;
                window.goatcounter.count({ path: "event/" + name, title: name, event: true });
            }

            function syncControls() {
                var theme = activeTheme();
                var size = activeSize();
                themeButtons.forEach(function(button) {
                    button.setAttribute("aria-pressed", button.dataset.themeChoice === theme ? "true" : "false");
                });
                sizeButtons.forEach(function(button) {
                    button.setAttribute("aria-pressed", button.dataset.textSizeChoice === size ? "true" : "false");
                });
                if (sizeToggle) sizeToggle.textContent = size === "large" ? "(^)" : size === "small" ? "(v)" : "(-)";
            }

            themeButtons.forEach(function(button) {
                button.addEventListener("click", function() {
                    var theme = button.dataset.themeChoice;
                    if (theme !== "light" && theme !== "dark") return;
                    root.dataset.theme = theme;
                    persist("theme", theme);
                    syncControls();
                });
            });

            if (sizeToggle && sizeStrip) {
                sizeToggle.addEventListener("click", function() {
                    var open = sizeStrip.hasAttribute("hidden");
                    if (open) {
                        sizeStrip.removeAttribute("hidden");
                    } else {
                        sizeStrip.setAttribute("hidden", "");
                    }
                    sizeToggle.setAttribute("aria-expanded", open ? "true" : "false");
                });
            }

            sizeButtons.forEach(function(button) {
                button.addEventListener("click", function() {
                    var size = button.dataset.textSizeChoice;
                    if (size !== "small" && size !== "standard" && size !== "large") return;
                    root.dataset.size = size;
                    persist("textSize", size);
                    syncControls();
                });
            });

            if (window.matchMedia) {
                window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncControls);
            }

            document.querySelectorAll("[data-goat-event]").forEach(function(link) {
                link.addEventListener("click", function() {
                    track(link.dataset.goatEvent);
                });
            });

            document.querySelectorAll("[data-subscribe-form]").forEach(function(form) {
                var message = form.parentElement ? form.parentElement.querySelector("[data-subscribe-message]") : null;
                var submit = form.querySelector("[data-subscribe-submit]");
                var originalText = submit ? submit.textContent : "";

                function showMessage(text, state) {
                    if (!message) return;
                    message.textContent = text;
                    message.dataset.state = state;
                    message.hidden = false;
                }

                form.addEventListener("submit", function(event) {
                    if (!window.fetch || !window.FormData) return;
                    event.preventDefault();
                    track("subscribe-attempt");
                    if (message) {
                        message.hidden = true;
                        message.textContent = "";
                        delete message.dataset.state;
                    }
                    if (submit) {
                        submit.disabled = true;
                        submit.textContent = "receiving";
                    }

                    window.fetch(form.dataset.fetchAction || form.action, {
                        method: "POST",
                        body: new FormData(form),
                        credentials: "omit",
                        mode: "no-cors"
                    }).then(function() {
                        form.reset();
                        showMessage("Check your email.", "success");
                        track("subscribe-success");
                        if (submit) {
                            submit.textContent = "received";
                            window.setTimeout(function() {
                                submit.textContent = originalText;
                            }, 1800);
                        }
                    }).catch(function() {
                        showMessage("Could not subscribe right now.", "error");
                        track("subscribe-error");
                    }).finally(function() {
                        if (submit) {
                            submit.disabled = false;
                            if (submit.textContent === "receiving") submit.textContent = originalText;
                        }
                    });
                });
            });

            document.querySelectorAll("[data-share-url]").forEach(function(button) {
                button.addEventListener("click", function() {
                    var url = button.getAttribute("data-share-url") || window.location.href;
                    var title = button.getAttribute("data-share-title") || document.title;
                    var original = button.textContent;

                    function copied() {
                        button.textContent = "COPIED";
                        window.setTimeout(function() {
                            button.textContent = original;
                        }, 1600);
                    }

                    function fallbackCopy() {
                        if (navigator.clipboard && window.isSecureContext) {
                            return navigator.clipboard.writeText(url).then(copied);
                        }
                        window.prompt("Copy this link:", url);
                        copied();
                        return Promise.resolve();
                    }

                    if (navigator.share) {
                        navigator.share({ title: title, url: url }).catch(function(error) {
                            if (!error || error.name !== "AbortError") fallbackCopy();
                        });
                    } else {
                        fallbackCopy();
                    }
                });
            });

            syncControls();
        })();
    </script>
