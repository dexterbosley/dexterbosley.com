<ul class="sidebar-menu">
    <li><a href="/" title="All" class="{{ if .IsHome }}active{{ end }}">All</a></li>
    <li><a href="/essays/" title="Essays" class="{{ if in .RelPermalink "/essays/" }}active{{ end }}">Essays</a></li>
    <li><a href="/stories/" title="Stories" class="{{ if in .RelPermalink "/stories/" }}active{{ end }}">Stories</a></li>
    <li><a href="/about/" title="About" class="{{ if in .RelPermalink "/about/" }}active{{ end }}">About</a></li>
</ul>

<div style="margin: 20px 0;">
    <a href="/subscribe/" style="
        display: inline-flex; 
        align-items: center; 
        justify-content: flex-end; /* Aligns right like the rest of the sidebar */
        gap: 8px; 
        font-size: 16px; 
        color: var(--secondary); 
        text-decoration: none; 
        transition: color 0.2s ease;
    "
    onmouseover="this.style.color='var(--primary)'"
    onmouseout="this.style.color='var(--secondary)'"
    >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Subscribe
    </a>
</div>

<div style="margin-top: 25px; background: var(--entry); padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
    <h3 style="font-size: 11px; text-transform: uppercase; color: var(--secondary); margin: 0 0 10px 0; letter-spacing: 2px; font-weight: bold;">Popular</h3>
    <ul class="sidebar-menu" style="font-size: 14px; line-height: 1.4; margin: 0; padding: 0;">
        <li style="margin-bottom: 6px;"><a href="/essays/test-essay/" style="display: block;">Test Essay</a></li>
        <li><a href="/stories/test-story/" style="display: block;">Test Story</a></li>
    </ul>
</div>
