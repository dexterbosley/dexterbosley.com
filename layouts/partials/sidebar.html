<ul class="sidebar-menu">
    {{- $currentPage := . }}
    {{- range .Site.Menus.main }}
    <li>
        <a href="{{ .URL }}" title="{{ .Name }}" class="{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{ end }}">
            {{ .Name }}
        </a>
    </li>
    {{- end }}
</ul>

<div style="margin-top: 2rem;">
    <p><small>© 2025</small></p>
</div>
