{{- define "main" }}
<section class="home-intro subscribe-intro" aria-label="Subscribe">
    <figure class="home-image object-width">
        {{ partial "responsive-image.html" (dict "page" . "src" "/images/homepage-lake-annecy.jpeg" "alt" "People on a lawn beside a lake with mountains in the distance" "sizes" "(max-width: 480px) calc((100vw - 32px) * .72), (max-width: 672px) calc((100vw - 32px) * .6), 384px" "widths" (slice 320 384 640 768) "loading" "eager" "fetchpriority" "high") }}
    </figure>
    <div class="about-copy subscribe-copy">
        {{ .Content }}
    </div>
    <form class="subscribe-form" action="https://newsletter.dexterbosley.com/subscription/form" method="post" data-subscribe-form>
        <input type="hidden" name="l" value="853dabc3-3d14-4070-92d6-95f37ad85ae9">
        <div class="subscribe-field">
            <label for="subscribe-name">Name (optional)</label>
            <input id="subscribe-name" type="text" name="name" autocomplete="name">
        </div>
        <div class="subscribe-field">
            <label for="subscribe-email">Email</label>
            <input id="subscribe-email" type="email" name="email" autocomplete="email" required data-subscribe-email>
        </div>
        <button class="subscribe-submit" type="submit" data-subscribe-submit>Subscribe</button>
    </form>
</section>
{{- end }}
