{{- define "main" }}
{{- $type := cond (eq .Section "stories") "Story" "Essay" }}
<article class="post-single">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        <div class="post-meta">{{ .Date.Format "2006-01-02" }} / {{ $type }}</div>
    </header>

    <div class="post-content">
        {{ .Content }}
    </div>

    <nav class="post-nav" aria-label="Post navigation">
        <a href="{{ if eq .Section "stories" }}/stories/{{ else if eq .Section "essays" }}/essays/{{ else }}/{{ end }}">Back to {{ if eq .Section "stories" }}Stories{{ else if eq .Section "essays" }}Essays{{ else }}All{{ end }}</a>
    </nav>
</article>
{{- end }}
