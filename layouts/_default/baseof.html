<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ if .IsHome }}Thinking in Public{{ else }}{{ .Title }} | Thinking in Public{{ end }}</title>
    {{- partial "head.html" . -}}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'DM Sans', -apple-system, sans-serif;
            font-weight: 300;
            font-size: 16px;
            line-height: 1.6;
            background: #fff;
            color: #1a1a1a;
        }
        
        .site-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        
        /* Header */
        .site-header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }
        
        .site-title {
            font-size: 28px;
            font-weight: 400;
            margin: 0 0 6px 0;
        }
        
        .site-title a {
            color: #1a1a1a;
            text-decoration: none;
        }
        
        .site-subtitle {
            font-size: 14px;
            color: #888;
            font-weight: 300;
        }
        
        /* Layout */
        .content-wrapper {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 60px;
        }
        
        /* Sidebar Nav */
        .sidebar-nav {
            position: sticky;
            top: 40px;
        }
        
        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar-nav li {
            margin-bottom: 12px;
        }
        
        .sidebar-nav a {
            font-size: 15px;
            font-weight: 300;
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .sidebar-nav a:hover {
            color: #1a1a1a;
        }
        
        .sidebar-nav a.active {
            color: #1a1a1a;
            font-weight: 500;
        }
        
        /* Main content */
        .main-content {
            min-width: 0;
        }
        
        /* Footer */
        .site-footer {
            text-align: center;
            padding-top: 40px;
            margin-top: 60px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #999;
        }
        
        /* Mobile */
        @media (max-width: 700px) {
            .site-wrapper {
                padding: 30px 20px 80px;
            }
            
            .content-wrapper {
                display: block;
            }
            
            .sidebar-nav {
                display: none;
            }
            
            .mobile-nav {
                display: flex !important;
            }
        }
        
        /* Mobile bottom nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #eee;
            padding: 12px 0;
            justify-content: space-around;
            z-index: 100;
        }
        
        .mobile-nav a {
            font-size: 12px;
            color: #666;
            text-decoration: none;
            padding: 8px 16px;
        }
        
        .mobile-nav a.active {
            color: #1a1a1a;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <h1 class="site-title"><a href="/">Thinking in Public</a></h1>
            <p class="site-subtitle">by Dexter Bosley</p>
        </header>
        
        <div class="content-wrapper">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="/">All</a></li>
                    <li><a href="/essays/">Essays</a></li>
                    <li><a href="/stories/">Stories</a></li>
                    <li><a href="/about/">About</a></li>
                </ul>
            </nav>
            
            <main class="main-content">
                {{ block "main" . }}{{ end }}
            </main>
        </div>
        
        <footer class="site-footer">
            © 2026 Dexter Bosley
        </footer>
    </div>
    
    <nav class="mobile-nav">
        <a href="/">All</a>
        <a href="/essays/">Essays</a>
        <a href="/stories/">Stories</a>
        <a href="/about/">About</a>
    </nav>
    
    <script>
        (function() {
            const path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.sidebar-nav a, .mobile-nav a').forEach(link => {
                const href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });
        })();
    </script>
    
    {{ partial "footer.html" . }}
</body>
</html>
