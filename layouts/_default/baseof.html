<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    {{ partial "head.html" . }}
    <style>
        /* --- LAYOUT CSS --- */
        #Box { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        @media (min-width: 800px) {
            #Box { 
                display: grid; 
                grid-template-columns: 200px 1fr; 
                grid-template-rows: auto 1fr; 
                grid-template-areas: "banner banner" "sidebar main"; 
                column-gap: 40px; 
            }
            .df-banner-wrapper { grid-area: banner; margin-bottom: 20px; }
            #Sidebar { grid-area: sidebar; text-align: right; border-right: 1px solid var(--border); padding-right: 20px; }
            #Main { grid-area: main; }
        }
        
        @media (max-width: 799px) {
            #Sidebar { 
                text-align: center; 
                border-bottom: 1px solid var(--border); 
                padding-bottom: 20px; 
                margin-bottom: 20px; 
            }
        }
        
        /* --- SIDEBAR LINKS --- */
        .sidebar-menu { list-style: none; padding: 0; line-height: 2.0; font-size: 18px; }
        .sidebar-menu a { 
            text-decoration: none; 
            color: var(--primary); 
            border-bottom: none; /* Default: No underline */
            display: inline-block; 
        }
        .sidebar-menu a:hover { color: var(--secondary); }
        
        /* --- ACTIVE STATE --- */
        .sidebar-menu a.active { 
            font-weight: bold !important; 
            border-bottom: none !important; 
            color: var(--primary) !important;
        }
    </style>
</head>
<body class="" id="top">
    <div id="Box">
        <div class="df-banner-wrapper">
            {{ partial "header.html" . }}
        </div>

        <div id="Sidebar">
            <ul class="sidebar-menu">
                <li><a href="/">All</a></li>
                <li><a href="/essays/">Essays</a></li>
                <li><a href="/stories/">Stories</a></li>
                <li><a href="/about/">About</a></li>
            </ul>
        </div>

        <main id="Main" class="main">
            {{ block "main" . }}{{ end }}
        </main>
    </div>
    {{ partial "footer.html" . }}

    <script>
        (function() {
            // Remove "active" from everyone first (Safety measure)
            document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));

            const currentPath = window.location.pathname.replace(/\/$/, ""); // Strip trailing slash
            const links = document.querySelectorAll('.sidebar-menu a');
            
            links.forEach(link => {
                const linkHref = link.getAttribute('href');
                const linkPath = linkHref.replace(/\/$/, ""); // Strip trailing slash
                
                // 1. HOME: Only match if current path is empty or "/"
                if ((currentPath === "" || currentPath === "/") && (linkPath === "" || linkPath === "/")) {
                    link.classList.add('active');
                }
                // 2. SECTIONS: Match if path starts with link (but link isn't home)
                // This ensures "/essays/" matches "/essays/my-post"
                else if (linkPath !== "" && linkPath !== "/" && currentPath.startsWith(linkPath)) {
                    link.classList.add('active');
                }
            });
        })();
    </script>
</body>
</html>
