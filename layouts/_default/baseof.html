<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}">
<head>
    {{- partial "head.html" . -}}
</head>

<body class="{{ if .Site.Params.list_layout }}list{{ end }}" id="top">

    <div id="Box">
        
        <div class="df-banner-wrapper">
            {{- partial "header.html" . -}}
        </div>

        <div id="Sidebar">
            {{- partial "sidebar.html" . -}}
        </div>

        <main id="Main" class="main">
            {{- block "main" . }}{{- end }}
        </main>

    </div>

    {{- partial "footer.html" . -}}

</body>
</html>
