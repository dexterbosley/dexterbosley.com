<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}Dexter Bosley{{ else }}{{ .Title }} | Dexter Bosley{{ end }}</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --paper: #f7f7f7;
            --ink: #080808;
            --muted: #777;
            --red: #d40000;
            --measure: 700px;
        }

        html {
            background: var(--paper);
            color: var(--ink);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 20px;
            line-height: 1.55;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 0.18em;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 2rem 0;
        }

        .site {
            width: min(calc(100% - 96px), var(--measure));
            margin: 0 auto;
            padding: 64px 0 88px;
        }

        .site-header {
            margin-bottom: 88px;
        }

        .site-title {
            display: inline-block;
            font-size: 1.08rem;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .site-email {
            display: block;
            margin-top: 0.55rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .site-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            margin-top: 84px;
            color: var(--red);
            font-size: 1rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .site-nav a.is-active {
            font-weight: 800;
        }

        .home-intro {
            max-width: var(--measure);
            margin: 0 0 96px;
            font-size: 1.02rem;
            line-height: 1.55;
        }

        .home-intro p {
            margin: 0 0 2rem;
        }

        .page-header,
        .post-header {
            max-width: var(--measure);
            margin-bottom: 3rem;
        }

        .page-title,
        .post-title {
            margin: 0 0 0.5rem;
            font-size: 1.08rem;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .post-meta {
            color: var(--muted);
            font-size: 0.86rem;
            text-transform: uppercase;
        }

        .post-list {
            display: grid;
            gap: 0.8rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .post-entry {
            display: grid;
            grid-template-columns: 3.5ch minmax(80px, 1fr) auto;
            align-items: center;
            gap: 1.1rem;
            min-width: 0;
        }

        .entry-number,
        .entry-title {
            font-size: 1rem;
            line-height: 1.2;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .entry-rule {
            height: 2px;
            background: var(--ink);
        }

        .entry-title {
            max-width: 52ch;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-single,
        .about-page {
            max-width: var(--measure);
        }

        .post-content {
            overflow-wrap: break-word;
        }

        .post-content > *:first-child {
            margin-top: 0;
        }

        .post-content p,
        .post-content ul,
        .post-content ol,
        .post-content blockquote,
        .post-content pre,
        .post-content hr {
            margin: 0 0 1.55rem;
        }

        .post-content h2,
        .post-content h3,
        .post-content h4 {
            margin: 2.6rem 0 1rem;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .post-content ul,
        .post-content ol {
            padding-left: 1.4rem;
        }

        .post-content li {
            margin: 0 0 0.5rem;
        }

        .post-content blockquote {
            padding-left: 1rem;
            border-left: 2px solid var(--ink);
            color: #333;
        }

        .post-content hr {
            border: 0;
            border-top: 2px solid var(--ink);
        }

        .post-content pre {
            overflow-x: auto;
            padding: 1rem;
            border: 2px solid var(--ink);
        }

        .post-content a {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 0.18em;
        }

        .post-nav,
        .pagination {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 4rem;
            color: var(--red);
            font-size: 0.86rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .pagination-current {
            color: var(--ink);
            font-weight: 800;
        }

        @media (max-width: 760px) {
            html {
                font-size: 16px;
            }

            .site {
                width: min(calc(100% - 32px), var(--measure));
                padding: 36px 0 64px;
            }

            .site-header {
                margin-bottom: 56px;
            }

            .site-nav {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.9rem 1.5rem;
                margin-top: 48px;
            }

            .home-intro {
                margin-bottom: 72px;
            }

            .post-entry {
                grid-template-columns: 3.5ch 1fr;
                gap: 0.55rem 0.9rem;
            }

            .entry-rule {
                display: none;
            }

            .entry-title {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <main class="site">
        <header class="site-header">
            <a class="site-title" href="/">HI, I AM TRYING TO THINK MORE.</a>
            <a class="site-email" href="mailto:dexterbosley@gmail.com">dexterbosley@gmail.com</a>
            <nav class="site-nav" aria-label="Primary navigation">
                <a{{ if .IsHome }} class="is-active"{{ end }} href="/">All</a>
                <a{{ if eq .Section "essays" }} class="is-active"{{ end }} href="/essays/">Essays</a>
                <a{{ if eq .Section "stories" }} class="is-active"{{ end }} href="/stories/">Stories</a>
                <a{{ if eq .RelPermalink "/about/" }} class="is-active"{{ end }} href="/about/">About</a>
            </nav>
        </header>

        {{ block "main" . }}{{ end }}
    </main>
</body>
</html>
