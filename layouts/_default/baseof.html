<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}">
{{- partial "head.html" . }}
{{ $section := "" }}
{{ if .File }}
  {{ $section = index (split .File.Dir "/") 0 }}
{{ else if .Section }}
  {{ $section = .Section }}
{{ end }}
<body class="
{{- if (ne .Kind "page") }} list-page{{ end }}
{{- if eq .Kind "home" }} home{{ end }}
{{- if .Param "hidemeta" }} hidemeta{{ end }}"
data-section="{{ $section }}">
{{- partial "header.html" . }}
<main class="main">
{{- block "main" . }}{{- end }}
</main>
{{ partial "footer.html" . }}
</body>
</html>
