<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    {{ partial "head.html" . }}
    <style>
        /* --- LAYOUT CSS --- */
        #Box { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        @media (min-width: 800px) {
            #Box { 
                display: grid; 
                grid-template-columns: 200px 1fr; 
                grid-template-rows: auto 1fr; 
                grid-template-areas: "banner banner" "sidebar main"; 
                column-gap: 40px; 
            }
            .df-banner-wrapper { grid-area: banner; margin-bottom: 20px; }
            #Sidebar { grid-area: sidebar; text-align: right; border-right: 1px solid var(--border); padding-right: 20px; }
            #Main { grid-area: main; }
        }
        
        @media (max-width: 799px) {
            #Sidebar { 
                text-align: center; 
                border-bottom: 1px solid var(--border); 
                padding-bottom: 20px; 
                margin-bottom: 20px; 
            }
        }
        
        /* --- SIDEBAR LINKS --- */
        .sidebar-menu { list-style: none; padding: 0; line-height: 2.0; font-size: 18px; }
        /* Default state: No underline, normal weight */
        .sidebar-menu a { text-decoration: none; color: var(--primary); border-bottom: none; display: inline-block; }
        .sidebar-menu a:hover { color: var(--secondary); }
        
        /* --- ACTIVE STATE (BOLD ONLY) --- */
        .sidebar-menu a.active { 
            font-weight: bold !important; 
            border-bottom: none !important; /* Ensures no underline appears */
        }
    </style>
</head>
<body class="" id="top">
    <div id="Box">
        <div class="df-banner-wrapper">
            {{ partial "header.html" . }}
        </div>

        <div id="Sidebar">
            <ul class="sidebar-menu">
                <li><a href="/">All</a></li>
                <li><a href="/essays/">Essays</a></li>
                <li><a href="/stories/">Stories</a></li>
                <li><a href="/about/">About</a></li>
            </ul>
        </div>

        <main id="Main" class="main">
            {{ block "main" . }}{{ end }}
        </main>
    </div>
    {{ partial "footer.html" . }}

    <script>
        (function() {
            // Get current path and remove trailing slash for consistent comparison
            const currentPath = window.location.pathname.replace(/\/$/, "");
            const links = document.querySelectorAll('.sidebar-menu a');
            
            links.forEach(link => {
                // Get link path and remove trailing slash
                const linkPath = link.getAttribute('href').replace(/\/$/, "");
                
                // 1. HOME: If both are empty strings or just slash (after replacing), it's Home
                if ((currentPath === "" || currentPath === "/") && (linkPath === "" || linkPath === "/")) {
                    link.classList.add('active');
                }
                // 2. OTHER PAGES: If current path starts with link path (and link isn't home)
                // e.g. current: "/about" matches link: "/about"
                else if (linkPath !== "" && linkPath !== "/" && currentPath.startsWith(linkPath)) {
                    link.classList.add('active');
                }
            });
        })();
    </script>
</body>
</html>
