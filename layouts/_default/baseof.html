<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="light">
<head>
    <script>document.documentElement.setAttribute("data-theme","light");</script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ if .IsHome }}Thinking in Public{{ else }}{{ .Title }} | Thinking in Public{{ end }}</title>
    {{- partial "head.html" . -}}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'DM Sans', -apple-system, sans-serif;
            font-weight: 300;
            font-size: 16px;
            line-height: 1.6;
            background: #fff;
            color: #f5f0e8;
        }
        
        .site-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        
        /* Header */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e0d8c8;
        }
        
        .site-branding {
            text-align: left;
        }
        
        .site-title {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 4px 0;
            line-height: 1.2;
        }
        
        .site-title a {
            color: #f5f0e8;
            text-decoration: none;
        }
        
        .site-subtitle {
            font-size: 13px;
            color: #908070;
            font-weight: 300;
            margin: 0;
        }
        
        /* Dark mode toggle */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        
        .theme-toggle:hover {
            opacity: 1;
        }
        
        .theme-toggle .moon-icon {
            display: none;
        }
        
        /* Layout */
        .content-wrapper {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 50px;
        }
        
        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 40px;
            align-self: start;
        }
        
        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }
        
        .sidebar-nav li {
            margin-bottom: 10px;
        }
        
        .sidebar-nav a {
            font-size: 15px;
            font-weight: 300;
            color: #a09080;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .sidebar-nav a:hover {
            color: #f5f0e8;
        }
        
        .sidebar-nav a.active {
            color: #f5f0e8;
            font-weight: 500;
        }
        
        .subscribe-link {
            display: inline-block;
            font-size: 14px;
            font-weight: 300;
            color: #f5f0e8;
            text-decoration: none;
            border-bottom: 1px solid #f5f0e8;
            margin-bottom: 24px;
        }
        
        .subscribe-link:hover {
            color: #a09080;
            border-color: #a09080;
        }
        
        /* Popular section - bubble treatment */
        .popular-section {
            padding: 0;
            margin-top: 8px;
        }
        
        .popular-section h4 {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #908070;
            margin: 0 0 12px 0;
        }
        
        .popular-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .popular-section li {
            margin-bottom: 8px;
        }
        
        .popular-section li:last-child {
            margin-bottom: 0;
        }
        
        .popular-section a {
            font-size: 13px;
            font-weight: 300;
            color: #555;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .popular-section a:hover {
            color: #f5f0e8;
        }
        
        /* Main content */
        .main-content {
            min-width: 0;
        }
        
        /* Footer */
        .site-footer { display: none; }
        
        /* Hide default footer */
        .footer {
            display: none;
        }
        
        /* Mobile */
        
        @media (max-width: 700px) {
            .site-wrapper {
                padding: 24px 16px 80px;
                max-width: 100%;
                width: 100%;
            }
            
            .site-header {
                margin-bottom: 32px;
                padding-bottom: 24px;
            }
            
            .site-title {
                font-size: 28px;
                margin-bottom: 6px;
            }
            
            .site-subtitle {
                font-size: 12px;
            }
            
            .mobile-popular {
                margin-bottom: 28px;
            }
            
            .content-wrapper {
                display: block !important;
                grid-template-columns: none !important;
            }
            
            .sidebar {
                display: none;
            }
            
            .mobile-nav {
                display: flex !important;
            }
            
            .post-entry,
            article.post-entry,
            .post-entry.featured {
                width: calc(100vw - 32px) !important;
                max-width: calc(100vw - 32px) !important;
                min-width: 0 !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                box-sizing: border-box !important;
            }
            
            .entry-banner {
                margin-left: -20px !important;
                margin-right: -20px !important;
                width: calc(100% + 40px) !important;
            }
            
            .entry-banner img {
                width: 100% !important;
                height: 180px !important;
                object-fit: cover !important;
            }
            
            .pinned-banner {
                width: 100% !important;
                max-width: 100% !important;
            }
            
            .main-content {
                width: 100% !important;
                max-width: 100% !important;
            }
        }

        
        /* Mobile bottom nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #e0d8c8;
            padding: 12px 0;
            justify-content: space-around;
            z-index: 100;
        }
        
        .mobile-nav a {
            font-size: 12px;
            color: #a09080;
            text-decoration: none;
            padding: 8px 16px;
        }
        
        .mobile-nav a.active {
            color: #f5f0e8;
            font-weight: 500;
        }
        
        /* Dark mode */
        html[data-theme="light"] body {
            background: #f5f0e8;
            color: #2d2820;
        }
        
        html[data-theme="light"] .site-title a {
            color: #2d2820;
        }
        
        html[data-theme="light"] .site-header {
            border-color: #e0d8c8;
        }
        
        html[data-theme="light"] .sidebar-nav a {
            color: #706050;
        }
        
        html[data-theme="light"] .sidebar-nav a:hover,
        html[data-theme="light"] .sidebar-nav a.active {
            color: #2d2820;
        }
        
        html[data-theme="light"] .subscribe-link {
            color: #2d2820;
            border-color: #2d2820;
        }
        
        html[data-theme="light"] .subscribe-link:hover {
            color: #786850;
            border-color: #786850;
        }
        
        html[data-theme="light"] .popular-section {
            /* no special styling needed */
        }
        
        html[data-theme="light"] .popular-section h4 {
            color: #a09080;
        }
        
        html[data-theme="light"] .popular-section a {
            color: #706050;
        }
        
        html[data-theme="light"] .popular-section a:hover {
            color: #2d2820;
        }
        
        html[data-theme="light"] .site-footer {
            color: #a09080;
        }
        
        html[data-theme="light"] .mobile-nav {
            background: #f5f0e8;
            border-color: #e0d8c8;
        }
        
        html[data-theme="light"] .mobile-nav a {
            color: #908070;
        }
        
        html[data-theme="light"] .mobile-nav a.active {
            color: #2d2820;
        }
        
        html[data-theme="light"] .theme-toggle .sun-icon {
            display: none;
        }
        
        html[data-theme="light"] .theme-toggle .moon-icon {
            display: block;
        }
        
        /* Mobile Popular - Text Style */
        .mobile-popular {
            display: none;
            font-size: 13px;
            color: #908070;
            margin-bottom: 24px;
        }
        
        .mobile-popular a {
            color: #504030;
            text-decoration: none;
            border-bottom: 1px solid #d0c8b8;
        }
        
        .mobile-popular a:hover {
            color: #2d2820;
            border-color: #a09080;
        }
        
        .mobile-popular .sep {
            margin: 0 8px;
            color: #c0b8a8;
        }
        
        @media (max-width: 700px) {
            .mobile-popular {
                display: block;
            }
        }
    </style>

</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="site-branding">
                <h1 class="site-title"><a href="/">Thinking in Public</a></h1>
                <p class="site-subtitle">by Dexter Bosley</p>
            </div>
            
        </header>
        
        <div class="mobile-popular">
            Popular: <a href="/essays/test-essay/">On Writing</a><span class="sep">·</span><a href="/essays/test-essay-1/">The Craft</a><span class="sep">·</span><a href="/stories/test-story/">First Light</a>
        </div>
        
        <div class="content-wrapper">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <ul>
                        <li><a href="/">All</a></li>
                        <li><a href="/essays/">Essays</a></li>
                        <li><a href="/stories/">Stories</a></li>
                        <li><a href="/about/">About</a></li>
                    </ul>
                </nav>
                
                <a href="https://secure.givewell.org/" target="_blank" class="subscribe-link">Subscribe</a>
                
                <div class="popular-section">
                    <h4>Popular</h4>
                    <ul>
                        <li><a href="/essays/test-essay/">On Writing</a></li>
                        <li><a href="/essays/test-essay-1/">The Craft</a></li>
                        <li><a href="/stories/test-story/">First Light</a></li>
                    </ul>
                </div>
            </aside>
            
            <main class="main-content">
                {{ block "main" . }}{{ end }}
            </main>
        </div>
        
        
    </div>
    
    <nav class="mobile-nav">
        <a href="/">All</a>
        <a href="/essays/">Essays</a>
        <a href="/stories/">Stories</a>
        <a href="/about/">About</a>
    </nav>
    
    <script>
        // Active nav highlighting
        (function() {
            const path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.sidebar-nav a, .mobile-nav a').forEach(link => {
                const href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });
        })();
        
        // Dark mode toggle
        
    </script>

<script>
document.documentElement.setAttribute('data-theme', 'light');
localStorage.setItem('pref-theme', 'light');
</script>


<!-- NUCLEAR MOBILE FIX -->
<style>
/* ===========================================
   CARD TYPOGRAPHY - BALANCED PROPORTIONS (SCALED UP)
   =========================================== */

/* Post card base */
.post-entry {
    padding: 24px !important;
    margin-bottom: 36px !important;
}

/* Card title */
.entry-header h2 {
    font-size: 20px !important;
    font-weight: 400 !important;
    margin: 0 0 12px 0 !important;
    line-height: 1.3 !important;
}

/* Card quote */
.entry-quote {
    margin: 12px 0 !important;
    padding-left: 14px !important;
    border-left: 2px solid #d8d0c0 !important;
}
.entry-quote p {
    font-size: 14px !important;
    line-height: 1.45 !important;
    margin: 0 0 5px 0 !important;
    color: #706050 !important;
}
.entry-quote cite {
    font-size: 12px !important;
    color: #a09080 !important;
}

/* Card footer/meta */
.entry-footer {
    font-size: 13px !important;
    color: #a09080 !important;
    margin-top: 14px !important;
}

/* Card image */
.entry-banner {
    margin: -24px -24px 18px -24px !important;
    border-radius: 4px 4px 0 0 !important;
    overflow: hidden !important;
}
.entry-banner img {
    height: 200px !important;
    object-fit: cover !important;
    width: 100% !important;
}

/* ===========================================
   TRENDING BANNER
   =========================================== */
.pinned-banner {
    display: flex !important;
    align-items: center !important;
    padding: 16px 20px !important;
    margin-bottom: 32px !important;
    gap: 14px !important;
    border: 1px solid #e8e0d4 !important;
    border-radius: 6px !important;
    background: #fcfaf6 !important;
}
.pinned-type {
    font-size: 10px !important;
    padding: 4px 8px !important;
    border: 1px solid #c8b898 !important;
    border-radius: 3px !important;
    color: #a08860 !important;
    background: transparent !important;
}
.pinned-title {
    font-size: 16px !important;
    font-weight: 400 !important;
    color: #2d2820 !important;
    flex-grow: 1 !important;
}
.pinned-meta {
    font-size: 13px !important;
    color: #a09080 !important;
    margin-left: auto !important;
}

/* ===========================================
   MOBILE OVERRIDES
   =========================================== */
@media screen and (max-width: 700px) {
    .post-entry,
    .post-entry.featured,
    article.post-entry {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        box-sizing: border-box !important;
        padding: 18px !important;
        margin-bottom: 28px !important;
    }
    
    .entry-header h2 {
        font-size: 18px !important;
    }
    
    .entry-banner {
        margin: -18px -18px 14px -18px !important;
    }
    .entry-banner img {
        height: 180px !important;
    }
    
    .entry-quote p {
        font-size: 13px !important;
    }
    
    .pinned-banner {
        width: 100% !important;
        max-width: 100% !important;
        padding: 12px 16px !important;
        margin-bottom: 24px !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        justify-content: flex-start !important;
        align-items: center !important;
        gap: 10px !important;
    }
    .pinned-type {
        flex-shrink: 0 !important;
    }
    .pinned-title {
        font-size: 14px !important;
        flex-grow: 1 !important;
        text-align: left !important;
    }
    .pinned-meta {
        font-size: 11px !important;
        flex-shrink: 0 !important;
        margin-left: auto !important;
    }
}

/* Share button right align */
.post-meta {
    display: flex !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 6px !important;
}
.post-meta .share-btn-top {
    margin-left: auto !important;
}
.post-nav {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
}

/* Mobile nav active state - bold */
.mobile-nav a.active {
    font-weight: 600 !important;
}

/* Pagination current page - bold */
span.pagination-current,
.pagination span.pagination-current,
.pagination .pagination-current {
    font-weight: 600 !important;
    color: #2d2820 !important;
    text-decoration: underline !important;
    text-underline-offset: 4px !important;
    text-decoration-thickness: 1px !important;
}

/* Sidebar nav active - bold */
.sidebar-nav a.active {
    font-weight: 600 !important;
    color: #2d2820 !important;
}
</style>

</body>
</html>
