<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="dark">
<head>
    <script>document.documentElement.setAttribute("data-theme","dark");</script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ if .IsHome }}Thinking in Public{{ else }}{{ .Title }} | Thinking in Public{{ end }}</title>
    {{- partial "head.html" . -}}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'DM Sans', -apple-system, sans-serif;
            font-weight: 300;
            font-size: 16px;
            line-height: 1.6;
            background: #fff;
            color: #1a1a1a;
        }
        
        .site-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        
        /* Header */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }
        
        .site-branding {
            text-align: left;
        }
        
        .site-title {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 4px 0;
            line-height: 1.2;
        }
        
        .site-title a {
            color: #1a1a1a;
            text-decoration: none;
        }
        
        .site-subtitle {
            font-size: 13px;
            color: #888;
            font-weight: 300;
            margin: 0;
        }
        
        /* Dark mode toggle */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        
        .theme-toggle:hover {
            opacity: 1;
        }
        
        .theme-toggle .moon-icon {
            display: none;
        }
        
        /* Layout */
        .content-wrapper {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 50px;
        }
        
        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 40px;
            align-self: start;
        }
        
        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }
        
        .sidebar-nav li {
            margin-bottom: 10px;
        }
        
        .sidebar-nav a {
            font-size: 15px;
            font-weight: 300;
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .sidebar-nav a:hover {
            color: #1a1a1a;
        }
        
        .sidebar-nav a.active {
            color: #1a1a1a;
            font-weight: 500;
        }
        
        .subscribe-link {
            display: inline-block;
            font-size: 14px;
            font-weight: 300;
            color: #1a1a1a;
            text-decoration: none;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 24px;
        }
        
        .subscribe-link:hover {
            color: #666;
            border-color: #666;
        }
        
        /* Popular section - bubble treatment */
        .popular-section {
            padding: 0;
            margin-top: 8px;
        }
        
        .popular-section h4 {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;
            margin: 0 0 12px 0;
        }
        
        .popular-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .popular-section li {
            margin-bottom: 8px;
        }
        
        .popular-section li:last-child {
            margin-bottom: 0;
        }
        
        .popular-section a {
            font-size: 13px;
            font-weight: 300;
            color: #555;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .popular-section a:hover {
            color: #1a1a1a;
        }
        
        /* Main content */
        .main-content {
            min-width: 0;
        }
        
        /* Footer */
        .site-footer { display: none; }
        
        /* Hide default footer */
        .footer {
            display: none;
        }
        
        /* Mobile */
        @media (max-width: 700px) {
            .site-wrapper {
                padding: 30px 20px 80px;
            }
            
            .content-wrapper {
                display: block;
            }
            
            .sidebar {
                display: none;
            }
            
            .mobile-nav {
                display: flex !important;
            }
        }
        
        /* Mobile bottom nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #eee;
            padding: 12px 0;
            justify-content: space-around;
            z-index: 100;
        }
        
        .mobile-nav a {
            font-size: 12px;
            color: #666;
            text-decoration: none;
            padding: 8px 16px;
        }
        
        .mobile-nav a.active {
            color: #1a1a1a;
            font-weight: 500;
        }
        
        /* Dark mode */
        html[data-theme="dark"] body {
            background: #1a1a1a;
            color: #e0e0e0;
        }
        
        html[data-theme="dark"] .site-title a {
            color: #e0e0e0;
        }
        
        html[data-theme="dark"] .site-header {
            border-color: #333;
        }
        
        html[data-theme="dark"] .sidebar-nav a {
            color: #999;
        }
        
        html[data-theme="dark"] .sidebar-nav a:hover,
        html[data-theme="dark"] .sidebar-nav a.active {
            color: #e0e0e0;
        }
        
        html[data-theme="dark"] .subscribe-link {
            color: #e0e0e0;
            border-color: #e0e0e0;
        }
        
        html[data-theme="dark"] .subscribe-link:hover {
            color: #aaa;
            border-color: #aaa;
        }
        
        html[data-theme="dark"] .popular-section {
            /* no special styling needed */
        }
        
        html[data-theme="dark"] .popular-section h4 {
            color: #666;
        }
        
        html[data-theme="dark"] .popular-section a {
            color: #999;
        }
        
        html[data-theme="dark"] .popular-section a:hover {
            color: #e0e0e0;
        }
        
        html[data-theme="dark"] .site-footer {
            color: #666;
        }
        
        html[data-theme="dark"] .mobile-nav {
            background: #1a1a1a;
            border-color: #333;
        }
        
        html[data-theme="dark"] .mobile-nav a {
            color: #888;
        }
        
        html[data-theme="dark"] .mobile-nav a.active {
            color: #e0e0e0;
        }
        
        html[data-theme="dark"] .theme-toggle .sun-icon {
            display: none;
        }
        
        html[data-theme="dark"] .theme-toggle .moon-icon {
            display: block;
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="site-branding">
                <h1 class="site-title"><a href="/">Thinking in Public</a></h1>
                <p class="site-subtitle">by Dexter Bosley</p>
            </div>
            
        </header>
        
        <div class="content-wrapper">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <ul>
                        <li><a href="/">All</a></li>
                        <li><a href="/essays/">Essays</a></li>
                        <li><a href="/stories/">Stories</a></li>
                        <li><a href="/about/">About</a></li>
                    </ul>
                </nav>
                
                <a href="https://www.givewell.org" target="_blank" class="subscribe-link">Subscribe</a>
                
                <div class="popular-section">
                    <h4>Popular</h4>
                    <ul>
                        <li><a href="/essays/test-essay/">On Writing</a></li>
                        <li><a href="/essays/test-essay-1/">The Craft</a></li>
                        <li><a href="/stories/test-story/">First Light</a></li>
                        <li><a href="/stories/test-story-1/">The Waiting</a></li>
                    </ul>
                </div>
            </aside>
            
            <main class="main-content">
                {{ block "main" . }}{{ end }}
            </main>
        </div>
        
        
    </div>
    
    <nav class="mobile-nav">
        <a href="/">All</a>
        <a href="/essays/">Essays</a>
        <a href="/stories/">Stories</a>
        <a href="/about/">About</a>
    </nav>
    
    <script>
        // Active nav highlighting
        (function() {
            const path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.sidebar-nav a, .mobile-nav a').forEach(link => {
                const href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });
        })();
        
        // Dark mode toggle
        
    </script>

<script>
document.documentElement.setAttribute('data-theme', 'dark');
localStorage.setItem('pref-theme', 'dark');
</script>
</body>
</html>

<style>
/* Single Post Styles */
.post-single {
    max-width: 680px;
    margin: 0 auto;
}

.post-banner {
    margin: 0 0 20px 0;
    overflow: hidden;
    border-radius: 4px;
}

.post-banner img {
    width: 100%;
    height: auto;
    display: block;
    filter: grayscale(100%);
    transition: filter 0.6s ease;
}

.post-banner:hover img {
    filter: grayscale(0%);
}

.post-header {
    margin-bottom: 24px;
}

.post-title {
    font-size: 36px;
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 12px 0;
    letter-spacing: -0.02em;
}

.post-meta {
    font-size: 14px;
    color: #666;
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 32px;
}

.post-epigraph {
    border-left: 2px solid #ddd;
    padding-left: 20px;
    margin: 0 0 40px 0;
    font-style: italic;
}

.post-epigraph p {
    font-size: 17px;
    color: #555;
    margin: 0 0 8px 0;
    line-height: 1.6;
}

.post-epigraph cite {
    font-size: 14px;
    color: #888;
    font-style: normal;
}

.post-content {
    font-size: 17px;
    line-height: 1.75;
    color: #333;
}

.post-content p {
    margin: 0 0 24px 0;
}

.post-content h2 {
    font-size: 24px;
    font-weight: 400;
    margin: 48px 0 20px 0;
}

.post-content h3 {
    font-size: 20px;
    font-weight: 500;
    margin: 40px 0 16px 0;
}

.post-content blockquote {
    border-left: 2px solid #ddd;
    padding-left: 20px;
    margin: 32px 0;
    font-style: italic;
    color: #555;
}

.post-content a {
    color: #1a1a1a;
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: opacity 0.2s;
}

.post-content a:hover {
    opacity: 0.6;
}

.post-content hr {
    border: none;
    text-align: center;
    margin: 48px 0;
}

.post-content hr::before {
    content: "···";
    font-size: 20px;
    letter-spacing: 12px;
    color: #ccc;
}

/* Story-specific styling */
.story-content {
    font-size: 18px;
    line-height: 1.8;
}

.story-content p:first-of-type::first-letter {
    font-size: 3.2em;
    float: left;
    line-height: 0.8;
    padding-right: 12px;
    padding-top: 6px;
    font-weight: 400;
}

.post-nav {
    margin-top: 48px;
}

.back-link {
    font-size: 14px;
    color: #999;
    text-decoration: none;
    transition: color 0.2s;
    letter-spacing: 0.01em;
}

.back-link:hover {
    color: #1a1a1a;
}

/* Dark mode for single posts */
html[data-theme="dark"] .post-title {
    color: #e0e0e0;
}

html[data-theme="dark"] .post-meta {
    color: #666;
}

html[data-theme="dark"] .post-epigraph {
    border-left-color: #444;
}

html[data-theme="dark"] .post-epigraph p {
    color: #aaa;
}

html[data-theme="dark"] .post-epigraph cite {
    color: #666;
}

html[data-theme="dark"] .post-content {
    color: #ccc;
}

html[data-theme="dark"] .post-content blockquote {
    border-left-color: #444;
    color: #aaa;
}

html[data-theme="dark"] .post-content a {
    color: #e0e0e0;
}

html[data-theme="dark"] .post-content hr::before {
    color: #444;
}



html[data-theme="dark"] .back-link {
    color: #666;
}

html[data-theme="dark"] .back-link:hover {
    color: #e0e0e0;
}

/* Small delights */
html {
    scroll-behavior: smooth;
}

::selection {
    background: rgba(0, 0, 0, 0.08);
}

html[data-theme="dark"] ::selection {
    background: rgba(255, 255, 255, 0.15);
}

.post-entry {
    transition: transform 0.2s ease;
}

.post-entry:hover {
    transform: translateY(-2px);
}

.entry-banner img {
    transition: filter 0.5s ease, transform 0.5s ease;
}

.post-entry:hover .entry-banner img {
    transform: scale(1.02);
}

/* Fade in animation */
.post-single {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Mobile adjustments */
@media (max-width: 700px) {
    .post-title {
        font-size: 28px;
    }
    
    .post-content {
        font-size: 16px;
    }
    
    .story-content {
        font-size: 17px;
    }
    
    .story-content p:first-of-type::first-letter {
        font-size: 2.8em;
    }
    
    .post-banner {
        margin: 0 -20px 32px -20px;
        border-radius: 0;
    }
}

/* Post navigation */
.post-nav {
    margin-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.share-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 300;
    color: #999;
    cursor: pointer;
    padding: 8px 0;
    transition: color 0.2s;
}

.share-btn:hover {
    color: #1a1a1a;
}

.share-btn svg {
    opacity: 0.7;
}

.share-btn:hover svg {
    opacity: 1;
}

html[data-theme="dark"] .share-btn {
    color: #666;
}

html[data-theme="dark"] .share-btn:hover {
    color: #e0e0e0;
}


/* Post entry cards */
.post-entry {
    margin-bottom: 28px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.post-entry:last-of-type {
    margin-bottom: 0;
}

.pagination-bottom {
    margin-top: 32px;
}

.entry-footer {
    font-size: 13px;
    color: #888;
    margin-top: 12px;
}

.section-icon {
    display: none;
}

.main-content {
    max-width: 650px;
    margin: 0 auto;
}

</style>
