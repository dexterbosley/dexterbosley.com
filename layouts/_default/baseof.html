<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "auto" }}">
<head>
    {{- partial "head.html" . -}}
</head>

<body class="{{ if .Site.Params.list_layout }}list{{ end }}" id="top">

    <div id="Box">
        
        <div id="Banner">
            <a href="{{ "" | absLangURL }}" style="text-decoration: none; color: inherit;">
                <img src="/images/logo.png" alt="{{ .Site.Title }}" height="56" onerror="this.style.display='none';"> 
                <span style="font-size: 32px; font-weight: bold; font-family: sans-serif;">{{ .Site.Title }}</span>
            </a>
        </div>

        <div id="Sidebar">
            {{- partial "sidebar.html" . -}}
        </div>

        <main id="Main" class="main">
            {{- block "main" . }}{{- end }}
        </main>

    </div>

    {{- partial "footer.html" . -}}

</body>
</html>
