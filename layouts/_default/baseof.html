<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="light">
<head>
    <script>document.documentElement.setAttribute("data-theme","light");</script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ if .IsHome }}Thinking in Public{{ else }}{{ .Title }} | Thinking in Public{{ end }}</title>
    {{- partial "head.html" . -}}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ===========================================
   BASE STYLES
   =========================================== */
* { box-sizing: border-box; }

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: 'DM Sans', -apple-system, sans-serif;
    font-weight: 300;
    font-size: 18px;
    line-height: 1.6;
    background: #f5f0e8;
    color: #2d2820;
}

/* ===========================================
   LAYOUT
   =========================================== */
.site-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 40px;
}

.content-wrapper {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 50px;
}

.main-content {
    min-width: 0;
}

/* ===========================================
   HEADER
   =========================================== */
.site-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 50px;
    padding-bottom: 30px;
    border-bottom: 1px solid #e0d8c8;
}

.logo-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
}

.site-logo {
    width: 32px;
    height: auto;
}

.site-title-text {
    display: block;
    font-size: 24px;
    font-weight: 400;
    color: #2d2820;
    line-height: 1.2;
}

.site-subtitle {
    font-size: 13px;
    color: #908070;
    font-weight: 300;
    margin: 0;
}

/* ===========================================
   SIDEBAR
   =========================================== */
.sidebar {
    position: sticky;
    top: 40px;
    align-self: start;
}

.sidebar-nav ul {
    list-style: none;
    padding: 0;
    margin: 0 0 24px 0;
}

.sidebar-nav li {
    margin-bottom: 10px;
}

.sidebar-nav a {
    font-size: 15px;
    font-weight: 300;
    color: #706050;
    text-decoration: none;
    transition: color 0.2s;
}

.sidebar-nav a:hover,
.sidebar-nav a.active {
    color: #2d2820;
}

.sidebar-nav a.active {
    font-weight: 600;
}

.subscribe-link {
    display: inline-block;
    font-size: 14px;
    font-weight: 300;
    color: #2d2820;
    text-decoration: none;
    border-bottom: 1px solid #2d2820;
    margin-bottom: 24px;
}

.subscribe-link:hover {
    color: #786850;
    border-color: #786850;
}

.popular-section {
    padding: 0;
    margin-top: 8px;
}

.popular-section h4 {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #a09080;
    margin: 0 0 12px 0;
}

.popular-section ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.popular-section li {
    margin-bottom: 8px;
}

.popular-section a {
    font-size: 13px;
    font-weight: 300;
    color: #706050;
    text-decoration: none;
    transition: color 0.2s;
}

.popular-section a:hover {
    color: #2d2820;
}

/* ===========================================
   FEED CARDS (Homepage/List)
   =========================================== */
/* Override PaperMod defaults */
.post-entry {
    position: relative;
    margin-bottom: 40px;
    background: transparent !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 0 !important;
}

.post-entry:active {
    transform: none !important;
}

.post-entry .entry-banner {
    margin: 0;
    overflow: hidden;
    border-radius: 4px;
}

.post-entry .entry-banner img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

.post-entry:hover .entry-banner img {
    transform: scale(1.02);
}

/* Caption - styled like about page */
.post-entry > p.banner-credit {
    font-size: 11px;
    color: #a09080;
    font-style: italic;
    margin: 8px 0 0 0;
    padding: 0;
}

.post-entry .entry-header h2 {
    font-size: 26px;
    font-weight: 400;
    margin: 4px 0 12px 0;
    line-height: 1.3;
    color: #2d2820;
}

.post-entry .entry-quote {
    margin: 12px 0;
    padding-left: 14px;
    border-left: 2px solid #d8d0c0;
}

.post-entry .entry-quote p {
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 5px 0;
    color: #706050;
    font-style: italic;
}

.post-entry .entry-quote cite {
    font-size: 14px;
    color: #a09080;
}

.post-entry .entry-footer {
    font-size: 14px;
    color: #a09080;
    margin-top: 14px;
}

.post-entry .entry-link {
    position: absolute;
    inset: 0;
    z-index: 1;
}

/* ===========================================
   SINGLE POST PAGE
   =========================================== */
.post-header {
    margin-bottom: 8px;
}

.post-title {
    font-size: 36px;
    font-weight: 400;
    line-height: 1.2;
    margin: 0;
    color: #2d2820;
}

.post-banner {
    margin: 0 0 8px 0;
}

.post-banner img {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
}

.post-banner .banner-credit {
    font-size: 13px;
    color: #a09080;
    font-style: italic;
    margin: 10px 0 20px 0;
    padding: 0;
}

.post-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 14px;
    color: #a09080;
    margin-bottom: 32px;
}

.post-meta .share-btn-top {
    margin-left: auto;
}

.post-content {
    font-size: 18px;
    line-height: 1.7;
}

.post-content p {
    margin: 0 0 1.5em 0;
}

/* ===========================================
   ABOUT PAGE
   =========================================== */
.about-banner {
    margin-bottom: 8px;
}

.about-banner img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 4px;
}

.about-banner .banner-credit {
    font-size: 13px;
    color: #a09080;
    font-style: italic;
    margin-top: 8px;
}

/* ===========================================
   MOBILE POPULAR (text line)
   =========================================== */
.mobile-popular {
    display: none;
    font-size: 13px;
    color: #908070;
    margin-bottom: 24px;
}

.mobile-popular a {
    color: #504030;
    text-decoration: none;
    border-bottom: 1px solid #d0c8b8;
}

.mobile-popular a:hover {
    color: #2d2820;
    border-color: #a09080;
}

/* ===========================================
   MOBILE BOTTOM NAV
   =========================================== */
.mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #f5f0e8;
    border-top: 1px solid #e0d8c8;
    padding: 12px 0;
    justify-content: space-around;
    z-index: 100;
}

.mobile-nav a {
    font-size: 12px;
    color: #908070;
    text-decoration: none;
    padding: 8px 16px;
}

.mobile-nav a.active {
    color: #2d2820;
    font-weight: 600;
}

/* ===========================================
   HIDE UNUSED ELEMENTS
   =========================================== */
.site-footer,
.footer {
    display: none;
}

/* ===========================================
   MOBILE STYLES
   =========================================== */
@media (max-width: 700px) {
    .site-wrapper {
        padding: 24px 0 80px 0;
        max-width: 100%;
        width: 100%;
    }
    
    .site-header {
        padding: 0 16px;
        margin-bottom: 24px;
        padding-bottom: 20px;
    }
    
    .mobile-popular {
        display: block;
        padding: 0 16px;
    }
    
    .content-wrapper {
        display: block;
        width: 100%;
        max-width: 100%;
        padding: 0;
        margin: 0;
        gap: 0;
    }
    
    .main-content {
        width: 100%;
        max-width: 100%;
        padding: 0;
        margin: 0;
    }
    
    .sidebar {
        display: none;
    }
    
    .mobile-nav {
        display: flex;
    }
    
    /* Feed cards - full width, override PaperMod */
    .post-entry {
        margin-bottom: 32px;
        width: 100%;
        background: transparent !important;
        padding: 0 !important;
        border: none !important;
    }
    
    .post-entry .entry-banner {
        border-radius: 0;
        margin: 0;
    }
    
    .post-entry .entry-banner img {
        height: 300px;
        border-radius: 0;
    }
    
    .post-entry > p.banner-credit {
        font-size: 11px;
        padding: 8px 16px 0 16px;
        margin: 0;
    }
    
    .post-entry .entry-header {
        padding: 0 16px;
    }
    
    .post-entry .entry-header h2 {
        font-size: 22px;
        margin-top: 4px;
    }
    
    .post-entry .entry-quote {
        margin-left: 16px;
        margin-right: 16px;
    }
    
    .post-entry .entry-footer {
        padding: 0 16px;
    }
    
    .post-title {
        font-size: 28px;
    }
    
    .post-banner img {
        max-height: 300px;
    }
}
</style>
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="site-branding">
                <a href="/" class="logo-link">
                    <img src="/images/penguin-logo.svg" alt="" class="site-logo">
                    <div>
                        <span class="site-title-text">Thinking in Public</span>
                        <span class="site-subtitle">by Dexter Bosley</span>
                    </div>
                </a>
            </div>
        </header>
        
        <div class="mobile-popular">
            Popular: <a href="/stories/small-talk/">Small Talk</a>
        </div>
        
        <div class="content-wrapper">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <ul>
                        <li><a href="/">All</a></li>
                        <li><a href="/essays/">Essays</a></li>
                        <li><a href="/stories/">Stories</a></li>
                        <li><a href="/about/">About</a></li>
                    </ul>
                </nav>
                
                <a href="https://secure.givewell.org/" target="_blank" class="subscribe-link">Subscribe</a>
                
                <div class="popular-section">
                    <h4>Popular</h4>
                    <ul>
                        <li><a href="/stories/small-talk/">Small Talk</a></li>
                    </ul>
                </div>
            </aside>
            
            <main class="main-content">
                {{ block "main" . }}{{ end }}
            </main>
        </div>
    </div>
    
    <nav class="mobile-nav">
        <a href="/">All</a>
        <a href="/essays/">Essays</a>
        <a href="/stories/">Stories</a>
        <a href="/about/">About</a>
    </nav>
    
    <script>
        (function() {
            const path = window.location.pathname.replace(/\/page\/\d+\/?$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('.sidebar-nav a, .mobile-nav a').forEach(link => {
                const href = link.getAttribute('href').replace(/\/$/, '') || '/';
                if (path === '/' && href === '/') link.classList.add('active');
                else if (href !== '/' && path.startsWith(href)) link.classList.add('active');
            });
        })();
    </script>
</body>
</html>
