<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Thinking in Public</title>
    {{- partial "head.html" . -}}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* 1990s Minimal Aesthetic - inspired by ktuck.com */
        
        /* Force light theme */
        :root, html, html[data-theme="dark"], html[data-theme="light"] {
            --theme: #ffffff;
            --entry: #ffffff;
            --primary: #1a1a1a;
            --secondary: #666666;
            --tertiary: #f5f5f5;
            --content: #333333;
            --code-block-bg: #f8f8f8;
            --code-bg: #f0f0f0;
            --border: #e0e0e0;
            --gap: 24px;
            --content-gap: 20px;
            color-scheme: light;
        }

        /* Hide theme toggle */
        #theme-toggle, .theme-toggle, button[title="(Alt + T)"] { 
            display: none !important; 
        }

        /* Base typography */
        body {
            background: #ffffff !important;
            color: #1a1a1a;
            font-family: 'DM Sans', -apple-system, sans-serif;
            font-weight: 300;
            font-size: 16px;
            line-height: 1.7;
            letter-spacing: 0.01em;
        }

        /* Layout */
        #Box { 
            max-width: 880px; 
            margin: 0 auto; 
            padding: 50px 40px; 
        }
        
        @media (min-width: 800px) {
            #Box {
                display: grid;
                grid-template-columns: 160px 1fr;
                grid-template-rows: auto 1fr;
                grid-template-areas: "banner banner" "sidebar main";
                column-gap: 50px;
            }
            .df-banner-wrapper { 
                grid-area: banner; 
                margin-bottom: 40px; 
                padding-bottom: 25px;
                border-bottom: 1px solid #e0e0e0;
            }
            #Sidebar { 
                grid-area: sidebar; 
                text-align: left; 
                border-right: none; 
                padding-right: 0;
                display: flex;
                flex-direction: column;
            }
            #Main { grid-area: main; }
            .nav-group { order: 1; display: block !important; }
            .popular-group { order: 2; margin-top: 35px; }
            .mobile-menu-trigger { display: none !important; }
        }

        /* Mobile */
        @media (max-width: 799px) {
            #Box { display: block; padding: 30px 25px; }
            .df-banner-wrapper {
                margin-bottom: 25px;
                padding-bottom: 20px;
                border-bottom: 1px solid #e0e0e0;
            }
            #Sidebar {
                text-align: left;
                padding-bottom: 0;
                margin-bottom: 25px;
                display: flex;
                flex-direction: column;
                border-bottom: none;
            }
            .popular-group { order: 1; margin-bottom: 20px; }
            .nav-group { order: 2; }
            .mobile-menu-trigger {
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                cursor: pointer;
                padding: 5px;
                margin-left: 10px;
                color: #1a1a1a;
            }
            .nav-group {
                display: none; 
                padding-bottom: 15px;
                margin-top: 10px;
                margin-bottom: 15px;
            }
            .nav-group.show {
                display: block;
                animation: fadeIn 0.3s ease;
            }
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                gap: 5px 20px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header { background: transparent; border: none; box-shadow: none; }
        .logo a {
            font-family: 'DM Sans', sans-serif;
            font-size: 20px !important;
            font-weight: 300 !important;
            letter-spacing: 0.02em;
            color: #1a1a1a !important;
            text-decoration: none !important;
        }
        .logo span {
            font-size: 13px !important;
            font-weight: 300 !important;
            color: #888888 !important;
            letter-spacing: 0.02em;
        }

        /* Sidebar */
        .popular-group {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
        }
        .popular-group h3 {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px !important;
            font-weight: 500 !important;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #999999 !important;
            margin-bottom: 12px !important;
        }
        .sidebar-menu { 
            list-style: none; 
            padding: 0; 
            margin: 0;
            line-height: 2.0; 
            font-size: 15px; 
        }
        .sidebar-menu a {
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            text-decoration: none;
            color: #1a1a1a !important;
            border-bottom: none;
            display: inline-block;
            transition: color 0.2s ease;
        }
        .sidebar-menu a:hover { color: #666666 !important; }
        .sidebar-menu a.active {
            font-weight: 500 !important;
            color: #1a1a1a !important;
        }

        /* Subscribe - simple underline */
        .nav-subscribe-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 0 !important;
            border: none !important;
            border-radius: 0 !important;
            background: transparent !important;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px !important;
            font-weight: 300 !important;
            color: #1a1a1a !important;
            text-decoration: none;
            border-bottom: 1px solid #1a1a1a !important;
            letter-spacing: 0.02em;
            transition: opacity 0.2s ease;
        }
        .nav-subscribe-btn:hover {
            background: transparent !important;
            color: #666666 !important;
            border-bottom-color: #666666 !important;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Main content */
        .page-header h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #999999;
            margin-bottom: 35px;
        }

        /* Post entries */
        .post-entry {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            margin-bottom: 40px;
            padding: 0 !important;
            box-shadow: none !important;
        }
        .post-entry .entry-cover { display: none; }
        .post-entry .entry-header h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 19px;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .post-entry:hover .entry-header h2 { color: #666666; }
        .post-entry:hover { transform: none; }
        .post-entry .entry-content p {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: #666666;
            line-height: 1.6;
            margin: 0;
        }
        .post-entry .entry-footer {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 300;
            color: #999999;
            margin-top: 10px;
            letter-spacing: 0.02em;
        }
        .entry-link { border-radius: 0; }

        /* Footer */
        .footer {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 300;
            color: #999999;
            padding: 50px 40px 30px;
            text-align: center;
            background: transparent !important;
            border-top: 1px solid #e0e0e0;
            margin-top: 50px;
        }
        .footer a { color: #666666; text-decoration: none; }
        .footer span:last-child { display: none; }
        .top-link { display: none !important; }

        /* Single post */
        .post-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 26px;
            font-weight: 300;
            line-height: 1.3;
            margin-bottom: 12px;
        }
        .post-meta {
            font-size: 13px;
            font-weight: 300;
            color: #999999;
            margin-bottom: 35px;
        }
        .post-content {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.8;
            color: #333333;
        }
        .post-content p { margin-bottom: 1.4em; }
        .post-content h2, .post-content h3 {
            font-weight: 400;
            margin-top: 1.8em;
            margin-bottom: 0.7em;
        }

        /* Links */
        a { color: #1a1a1a; text-decoration: none; }
        a:hover { color: #666666; }
        .post-content a { border-bottom: 1px solid #ccc; }
        .post-content a:hover { border-bottom-color: #666; }

        /* Selection */
        ::selection { background: #e0e0e0; color: #1a1a1a; }

        /* Override any dark theme remnants */
        .list, .toc { background: transparent !important; }
    </style>

</head>
<body class="" id="top">
    <div id="Box">
        <div class="df-banner-wrapper">
            <header class="header">
                <nav class="nav" style="display: flex !important; justify-content: space-between; align-items: center; width: 100%;">
                    <div class="logo" style="display: flex; align-items: center; gap: 15px;">
                        <div style="display: flex; flex-direction: column; line-height: 1.2;">
                            <a href="/" accesskey="h" title="Thinking in Public">
                                Thinking in Public
                            </a>
                            <span>by Dexter Bosley</span>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <button class="mobile-menu-trigger" id="menu-trigger" aria-label="Toggle Menu">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="3" y1="18" x2="21" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </nav>
            </header>
        </div>

        <div id="Sidebar">
            <div class="popular-group">
                <h3>Popular</h3>
                <ul class="sidebar-menu" style="font-size: 14px; line-height: 1.6;">
                    <li style="margin-bottom: 4px;"><a href="/essays/test-essay/">Test Essay</a></li>
                    <li><a href="/stories/test-story/">Test Story</a></li>
                </ul>
            </div>

            <div class="nav-group" id="nav-group">
                <ul class="sidebar-menu">
                    <li><a href="/">All</a></li>
                    <li><a href="/essays/">Essays</a></li>
                    <li><a href="/stories/">Stories</a></li>
                    <li><a href="/about/">About</a></li>
                </ul>
                <div>
                    <a href="https://www.givewell.org" target="_blank" class="nav-subscribe-btn">Subscribe</a>
                </div>
            </div>
        </div>

        <main id="Main" class="main">
            {{ block "main" . }}{{ end }}
        </main>
    </div>

    {{ partial "footer.html" . }}

    <script>
        document.getElementById('menu-trigger').addEventListener('click', function() {
            document.getElementById('nav-group').classList.toggle('show');
        });
        (function() {
            const currentPath = window.location.pathname.replace(/\/$/, ""); 
            document.querySelectorAll('.sidebar-menu a').forEach(link => {
                link.classList.remove('active'); 
                const linkPath = link.getAttribute('href').replace(/\/$/, "");
                if ((currentPath === "" || currentPath === "/") && (linkPath === "" || linkPath === "/")) {
                    link.classList.add('active');
                } else if (linkPath !== "" && linkPath !== "/" && currentPath.startsWith(linkPath)) {
                    link.classList.add('active');
                }
            });
        })();
    </script>
</body>
</html>
