{{- define "main" }}
<article class="about-page post-single">
    <header class="post-header">
        <h1 class="post-title">About</h1>
    </header>

    {{- if .Params.cover.image }}
    <figure class="about-banner">
        <img src="{{ .Params.cover.image | absURL }}" alt="About banner">
    </figure>
    {{- end }}

    <div class="about-intro">
        <p>I'm Dexter — a product manager who writes to make sense of things.</p>
    </div>

    <div class="about-content post-content">
        {{ .Content }}
    </div>

    <div class="about-connect">
        <p>Say hello → <a href="mailto:dexter@dexterbosley.com">dexter@dexterbosley.com</a></p>
    </div>
</article>

<style>
.about-banner {
    margin: 0 0 32px 0;
    border-radius: 4px;
    overflow: hidden;
}
.about-banner img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    object-position: center 70%;
}
@media (max-width: 700px) {
    .about-banner img {
        height: 180px;
        object-position: center 70%;
    }
}
</style>
{{- end }}
