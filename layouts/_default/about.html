{{- define "main" }}
<section class="about-intro" aria-label="About Dexter">
    <figure class="home-image object-width about-image">
        {{ partial "responsive-image.html" (dict "page" . "src" .Params.cover.image "alt" .Params.cover.alt "sizes" "(max-width: 480px) calc((100vw - 32px) * .72), (max-width: 672px) calc((100vw - 32px) * .6), 384px" "widths" (slice 320 384 640 768) "loading" "eager" "decoding" "auto" "fetchpriority" "high") }}
    </figure>
    <div class="about-copy">
        {{ .Content }}
    </div>
</section>
{{ partial "site-footer.html" . }}
{{- end }}
