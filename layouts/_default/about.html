{{- define "main" }}
{{- $paragraphs := split .RawContent "\n\n" }}
<section class="home-intro about-intro" aria-label="About Dexter">
    <div class="about-copy">
        {{- with index $paragraphs 0 }}
            {{ . | $.RenderString }}
        {{- end }}
    </div>
    <figure class="home-banner">
        {{ partial "responsive-image.html" (dict "page" . "src" "/images/about-snow-banner.jpg" "alt" "Snow-covered trees and slope under a pale blue sky" "sizes" "(max-width: 472px) calc(100vw - 32px), 440px" "widths" (slice 320 440 640 880) "loading" "eager" "fetchpriority" "high") }}
    </figure>
    <div class="about-copy">
        {{- range after 1 $paragraphs }}
            {{ . | $.RenderString }}
        {{- end }}
    </div>
</section>
{{- end }}
