{{- define "main" }}
{{- $paragraphs := split .RawContent "\n\n" }}
<section class="home-intro about-intro" aria-label="About Dexter">
    <div class="about-copy">
        {{- with index $paragraphs 0 }}
            {{ . | $.RenderString }}
        {{- end }}
    </div>
    <figure class="home-banner" aria-label="Lake and mountains at dusk">
        {{ partial "responsive-image.html" (dict "page" . "src" "/images/about-snow-banner.jpg" "alt" "Snow-covered trees and slope under a pale blue sky" "sizes" "(max-width: 760px) min(440px, calc(100vw - 72px)), 440px" "widths" (slice 320 420 640 880) "loading" "eager" "decoding" "async" "fetchpriority" "high") }}
    </figure>
    <div class="about-copy">
        {{- range after 1 $paragraphs }}
            {{ . | $.RenderString }}
        {{- end }}
    </div>
</section>

{{ partial "home-index.html" . }}
{{- end }}
