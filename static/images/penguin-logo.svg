<svg viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Body: tall rectangle -->
  <rect x="6" y="8" width="20" height="28" rx="0" fill="#d0d4dc"/>
  <!-- Belly: inner lighter rectangle -->
  <rect x="10" y="14" width="12" height="18" fill="#8b9bb5"/>
  <!-- Head: square block -->
  <rect x="8" y="0" width="16" height="12" fill="#d0d4dc"/>
  <!-- Eyes: two small squares -->
  <rect x="12" y="4" width="3" height="3" fill="#191c24"/>
  <rect x="17" y="4" width="3" height="3" fill="#191c24"/>
  <!-- Left wing -->
  <rect x="0" y="12" width="6" height="16" fill="#7a8394"/>
  <!-- Right wing -->
  <rect x="26" y="12" width="6" height="16" fill="#7a8394"/>
  <!-- Feet -->
  <rect x="8" y="36" width="6" height="4" fill="#7a8394"/>
  <rect x="18" y="36" width="6" height="4" fill="#7a8394"/>
</svg>
